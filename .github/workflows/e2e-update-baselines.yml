# Capture Playwright visual baselines + auto-open a PR ([J6]).
#
# Why this exists: visual baselines for `toHaveScreenshot()` are
# platform-sensitive (Linux Chromium pixel output differs from
# macOS / Windows). Local developers can't safely produce baselines
# for the Linux CI runner from their own OS. This workflow runs
# Playwright on Linux with `--update-snapshots`, then opens a PR
# with the captured PNGs + the `test.fixme` → `test` flip in a
# single review-able diff.
#
# Run modes:
#   - `workflow_dispatch` only. NOT triggered automatically — an
#     operator clicks "Run workflow" the first time + after any
#     intentional UI change (new hero design, theme update, etc.).
#
# Output: a PR titled "chore(e2e): refresh visual baselines"
# containing the new screenshots under
# `apps/web/e2e/**/*-snapshots/` + the flip from `test.fixme` to
# `test`. Reviewer eyeballs the PNG diffs in the PR + merges.
name: e2e — update visual baselines

on:
  workflow_dispatch:

concurrency:
  group: e2e-update-baselines
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel_dev
          POSTGRES_DB: travel_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U travel -d travel_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travel:travel_dev@127.0.0.1:5432/travel_dev?schema=public
      DIRECT_URL: postgresql://travel:travel_dev@127.0.0.1:5432/travel_dev?schema=public
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter=web e2e:install

      - name: Build dist'd workspace packages
        run: pnpm turbo run build --filter='@app/*'

      - name: Generate Prisma client
        run: pnpm --filter=api run db:generate

      - name: Prisma migrate
        run: pnpm --filter=api run db:migrate:deploy

      # Step 1: flip every `test.fixme('visual: ...` back to `test(`
      # so the snapshot tests actually run during this capture pass.
      # The regular `e2e` job in ci.yml leaves them fixme'd until
      # the baselines exist — once this workflow merges its PR, the
      # flip becomes the permanent state.
      - name: Un-fixme visual tests for the capture run
        run: |
          # Match `test.fixme(` exactly on lines that mention "visual:"
          # to avoid touching unrelated test.fixme usage.
          for f in apps/web/e2e/*.spec.ts; do
            sed -i.bak -E "s/test\\.fixme\\((['\"])visual: /test(\\1visual: /g" "$f"
            rm "$f.bak"
          done

      - name: Capture baselines (Playwright --update-snapshots)
        run: pnpm --filter=web exec playwright test --update-snapshots

      - name: Open PR with new baselines + un-fixme flip
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/e2e-visual-baselines
          title: 'chore(e2e): refresh visual baselines [J6]'
          commit-message: |
            chore(e2e): refresh visual baselines

            Captured on the Linux CI runner via `playwright test
            --update-snapshots`. Flips the `test.fixme` markers on
            the visual specs back to live `test` so the gate is
            enforced from the next CI tick.
          body: |
            Auto-generated by the `e2e — update visual baselines`
            workflow. Review the PNG diffs in the
            `apps/web/e2e/**/*-snapshots/` paths to confirm the new
            baselines match the intended UI, then merge.

            After merge: the regular `e2e` job in `ci.yml` enforces
            pixel-level regression against these baselines on every PR.
          labels: visual-regression,automated
          add-paths: |
            apps/web/e2e/**
