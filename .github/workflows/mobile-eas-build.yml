# mobile-eas-build — EAS build for apps/mobile.
#
# Triggers:
#   - workflow_dispatch (manual; choose profile + platform)
#   - push to `main` touching apps/mobile/** → preview channel build
#
# Required repo secrets (operator-owed; documented in
# `docs/runbooks/mobile-eas-bootstrap.md` once it lands):
#   - EXPO_TOKEN              — `eas whoami` token, scope: read+build+submit
#   - APPLE_TEAM_ID           — Apple Developer team id (10-char alphanumeric)
#   - APPLE_ASC_APP_ID        — App Store Connect app id (numeric)
#   - GOOGLE_PLAY_SA_JSON     — Play Console service-account JSON (base64-encoded)
#
# Installed by [S-D5] of the S-series real-functionality closeout.

name: mobile-eas-build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/sdk/**'
      - '.github/workflows/mobile-eas-build.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        required: true
        default: 'preview'
        options: [development, preview, production]
      platform:
        description: 'Target platform'
        type: choice
        required: true
        default: 'all'
        options: [ios, android, all]

concurrency:
  group: mobile-eas-build-${{ github.ref }}-${{ inputs.profile || 'preview' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build ${{ inputs.profile || 'preview' }} (${{ inputs.platform || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # apps/mobile has its OWN pnpm-lock (isolated install per
        # [[expo-react-workspace-collision]]); --ignore-workspace
        # routes pnpm to it instead of the monorepo root.
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Materialise credentials
        run: |
          if [ -n "${{ secrets.GOOGLE_PLAY_SA_JSON }}" ]; then
            mkdir -p credentials
            echo "${{ secrets.GOOGLE_PLAY_SA_JSON }}" | base64 -d > credentials/play-service-account.json
          fi

      - name: Typecheck + lint (fast fail before a 30-min build)
        run: |
          pnpm typecheck
          pnpm lint

      - name: EAS build
        env:
          # Substituted into eas.json submit profiles at runtime.
          EAS_BUILD_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EAS_BUILD_APPLE_ASC_APP_ID: ${{ secrets.APPLE_ASC_APP_ID }}
        run: |
          PROFILE="${{ inputs.profile || 'preview' }}"
          PLATFORM="${{ inputs.platform || 'all' }}"
          eas build \
            --profile "$PROFILE" \
            --platform "$PLATFORM" \
            --non-interactive \
            --no-wait
          echo "Build dispatched. Track progress at https://expo.dev/accounts/<your-account>/projects/travel-super-app/builds"
