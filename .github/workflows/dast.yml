# Dynamic Application Security Testing (DAST) — [J4].
#
# SAST (Semgrep + eslint-plugin-security in ci.yml `security` job)
# reads the source. DAST does the opposite: it ATTACKS a running
# instance of the API and reports what it finds. The two are
# complementary — semgrep can't tell you that auth bypass works
# in production, only that the pattern in the code looks risky;
# DAST proves it by trying.
#
# Tool: OWASP ZAP Baseline scan via the official `zaproxy/action-
# baseline@v0.14.0` GitHub Action. MIT-licensed, no account/key
# needed, runs in ~5-10 minutes against a booted API.
#
# Posture:
#   - Runs on PR + push to main (PR-blocking gate)
#   - cmd_options: `-a` (alpha rules), `-j` (JSON output), `-l WARN`
#     (fail on WARN+, ignore INFO)
#   - Boots Postgres + Redis + API the same way ci.yml `load` does;
#     ZAP then probes /api/v1/* via the baseline ruleset
#   - Findings ABOVE the configured fail-level fail the job;
#     INFO-level findings post to the run summary without failing
#
# `.zap/rules.tsv` is the per-finding override (e.g., a CSP rule
# that's intentionally relaxed during local dev). Empty today.
name: dast

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # for the action's "auto-open issue on findings"
  pull-requests: write

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel_dev
          POSTGRES_DB: travel_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U travel -d travel_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travel:travel_dev@127.0.0.1:5432/travel_dev?schema=public
      DIRECT_URL: postgresql://travel:travel_dev@127.0.0.1:5432/travel_dev?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      API_BASE: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm turbo run build --filter='@app/*'

      - name: Prisma migrate
        run: pnpm --filter=api run db:migrate:deploy

      - name: Boot API (background)
        run: pnpm --filter=api dev &
        env:
          NODE_ENV: development

      - name: Wait for /health/ready
        run: |
          for i in {1..60}; do
            if curl -sf "$API_BASE/api/v1/health/ready" > /dev/null; then
              echo "API ready."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in 120s." >&2
          exit 1

      - name: OWASP ZAP Baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.API_BASE }}/api/v1
          # `.zap/rules.tsv` lets us mark individual ZAP rule IDs as
          # IGNORE / WARN / FAIL per-finding. We start with the file
          # empty — every finding above the default fail level
          # (MEDIUM) blocks the merge.
          rules_file_name: '.zap/rules.tsv'
          # -a alpha-rules · -j JSON output · -l WARN (fail on WARN+).
          cmd_options: '-a -j -l WARN'
          # Auto-open a GitHub Issue on the first finding so the
          # backlog is visible outside the failed-CI noise.
          allow_issue_writing: true
          fail_action: true
