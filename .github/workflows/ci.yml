name: CI

# What this gate covers, stated plainly:
#
# Runs: lint (24 packages), typecheck (35 packages), the API's unit suite
# (201 tests), and the test suites for web and every other package.
#
# Does NOT run: the API's e2e specs, or the Redis event-bus integration spec.
# Both need a live Postgres/Redis. The event-bus spec is additionally failing
# for reasons I don't understand yet -- it self-skips when Redis is absent, so
# it is not being falsely reported as green here; it simply doesn't run. Fixing
# it and then adding service containers to this workflow is the next job.
#
# There is no continue-on-error anywhere. If a step is in here, it is a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Prisma's typed client is generated, not committed. Without this, every
      # `import { TripStatus } from '@prisma/client'` fails to typecheck on a
      # clean checkout -- which is why this passed locally (a generated client
      # was already sitting in node_modules) and failed here.
      - name: Generate Prisma client
        run: pnpm --filter=api exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (api)
        run: pnpm --filter=api test:unit

      - name: Tests (web + packages)
        run: pnpm exec turbo run test --filter='!api'
