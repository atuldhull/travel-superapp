# Full CI pipeline — runs on every PR + every push to main.
#
# Four parallel jobs: lint, typecheck, arch, integration-tests.
# Each one bootstraps pnpm + caches node_modules, then runs the
# appropriate Turbo task scope. The `tests` job additionally boots
# Postgres / Redis / MinIO via GitHub services so integration
# tests that hit real Docker dependencies pass on the runner
# without a separate `docker compose up` step.
#
# Phase-0 smoke (`phase-0-smoke.yml`) stays as a separate, narrower
# gate — that file pre-dates this one and runs a faster boundary
# check. This file IS the broader pipeline that prompt
# `[IV.18.1.x]` reserved as a follow-up.
#
# Installed by prompt [IV.18.19.1]; `arch` job added by [E1] to
# enforce the architecture gates (dep-cruiser + madge + SDK drift)
# the road-to-10 review called for.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Lint — fastest signal. Runs eslint across every workspace.
  # ──────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist'd workspace packages
        # @app/config + @app/errors + @app/logger ship a compiled
        # dist/ that downstream packages import — same step the
        # phase-0 smoke uses.
        run: pnpm turbo run build --filter='@app/*'

      - name: Lint
        run: pnpm turbo run lint

  # ──────────────────────────────────────────────────────────────
  # Typecheck — independent of lint, runs in parallel.
  # ──────────────────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # tsc fails without the generated client.
        run: pnpm --filter=api run db:generate

      - name: Build dist'd workspace packages
        run: pnpm turbo run build --filter='@app/*'

      - name: Typecheck
        run: pnpm turbo run typecheck

  # ──────────────────────────────────────────────────────────────
  # Architecture gates ([E1]) — three checks, all expected to be
  # cheap (no DB, no Redis) so the job stays sub-2-minutes:
  #
  #   1. `pnpm arch`       — dependency-cruiser enforces hex layer
  #                         rules + no-cross-module-{infra,interface,
  #                         deep-import} + no-circular (with the
  #                         forwardRef `.module.ts` `viaNot` skip).
  #   2. `pnpm cycles`     — madge --circular as a parallel, runtime-
  #                         shape cycle detector (different tool, same
  #                         posture as dep-cruiser's no-circular).
  #                         Defense in depth for the payments-style
  #                         ESM-fatal cycle.
  #   3. `pnpm sdk:check`  — regenerates docs/api/openapi.yaml and
  #                         packages/sdk/src/generated/, then
  #                         `git diff --exit-code` over both. Stops
  #                         the controller-changed-without-regen drift
  #                         from accumulating; enforces the single-
  #                         client story from ADR-015.
  #
  # sdk:check boots AppModule via `api:openapi`, so we need the
  # Prisma client + @app/* dist builds + a writable working tree.
  # ──────────────────────────────────────────────────────────────
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # `api:openapi` (run inside sdk:check) loads AppModule, which
        # imports PrismaService. Without a generated client the boot
        # crashes before the OpenAPI export step runs.
        run: pnpm --filter=api run db:generate

      - name: Build dist'd workspace packages
        run: pnpm turbo run build --filter='@app/*'

      - name: Dep-cruiser
        run: pnpm arch

      - name: Madge — circular imports
        run: pnpm cycles

      - name: SDK drift gate
        # Refuses to merge if `docs/api/openapi.yaml` or the orval-
        # generated SDK has drifted from the live controller surface.
        # The script regenerates both, then `git diff --exit-code`s.
        run: pnpm sdk:check

      - name: Shared-types drift gate
        # Refuses to merge if `packages/shared-types/schemas/ai-service/`
        # has drifted from the Zod sources. The Python ai-service
        # consumes those JSON Schemas via datamodel-code-generator,
        # so a stale schema = a broken contract on the FastAPI side.
        # ([F3])
        run: pnpm shared-types:check

  # ──────────────────────────────────────────────────────────────
  # Domain-unit coverage gate ([H1]) — runs ONLY the pure-domain
  # `*-entity.unit.spec.ts` + `trip-transitions.unit.spec.ts`
  # specs (no Postgres / Redis / S3 needed), with a per-file ≥80%
  # threshold on every metric for every file under
  # `src/modules/**/domain/`. Makes the long-standing CLAUDE.md
  # "domain ≥ 80%" promise mechanical: a regression below the
  # threshold (or a new domain file landing without a unit spec)
  # fails the gate. Runs in its own job so coverage numbers post
  # to the PR even when the heavier integration job is queued.
  # ──────────────────────────────────────────────────────────────
  coverage-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Domain unit-coverage gate
        run: pnpm --filter=api cover:unit

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-domain
          path: apps/api/coverage/unit

  # ──────────────────────────────────────────────────────────────
  # Mutation testing ([H2]) — Stryker runs against the same 11
  # domain entities the coverage gate covers. Catches the
  # "line-executed-but-untested" gap that pure coverage misses.
  # Gated at ≥80% mutation score (global); current run is 81.01%
  # in ~5m35s. Reports lcov + html as artifacts so PR review can
  # browse the killed/survived mutant list.
  #
  # Runs in its own job so a flaky mutation run doesn't gate the
  # rest of the pipeline. Worth its own job because mutation
  # testing is the strongest signal we have that the test suite
  # is actually load-bearing.
  # ──────────────────────────────────────────────────────────────
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stryker mutation gate
        run: pnpm --filter=api mutate

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/api/reports/mutation

  # ──────────────────────────────────────────────────────────────
  # Security ([I3]) — two gates, both free, both keyless:
  #
  #   1. `pnpm audit --audit-level=critical` (BLOCK). 0 today;
  #      any critical CVE filed against a transitive dep fails
  #      the merge.
  #   2. `pnpm audit --audit-level=high` (INFORMATIONAL). 17 today
  #      (transitive @aws-sdk + ws + fast-xml-parser); posts to
  #      logs without failing the build so the backlog is visible
  #      but doesn't block on third-party upstream cadence.
  #   3. Semgrep SAST. The `auto` config bundles p/owasp-top-ten +
  #      p/typescript + p/nodejsscan rule packs (MIT, OSS, no
  #      account needed). Blocks on findings. Run `semgrep --config
  #      auto` locally to reproduce.
  # ──────────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CVE gate — critical (BLOCK)
        run: pnpm audit:critical

      - name: CVE gate — high (informational)
        run: pnpm audit:high

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/typescript
            p/nodejsscan

  # ──────────────────────────────────────────────────────────────
  # Web component tests ([I5]) — Vitest + React Testing Library +
  # vitest-axe against the `components/ui/` primitives. Hermetic
  # (jsdom env, no API, no Next runtime, no browser), runs in
  # sub-5s wall clock. Coverage gated per-file ≥80% on whatever
  # components have tests — current starter set is button + badge
  # + empty-state at 100%. Adding a new component to
  # `components/ui/` without a matching test fails the gate.
  # ──────────────────────────────────────────────────────────────
  web-components:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web component coverage gate
        run: pnpm --filter=web cover:unit

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web-components
          path: apps/web/coverage/unit

  # ──────────────────────────────────────────────────────────────
  # Integration tests — boot Postgres + Redis + MinIO as GitHub
  # service containers, then run jest. Env values mirror
  # `phase-0-smoke.yml` so the same setup.ts works.
  # ──────────────────────────────────────────────────────────────
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      # Plain Postgres 16 — close enough for the integration suite
      # that doesn't exercise PostGIS-specific features. PostGIS-
      # heavy tests skip themselves under a feature flag (see
      # apps/api/test/setup.ts). Tests that genuinely need PostGIS
      # land in the [IV.18.21.x] CI-with-PostGIS slice.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel_dev
          POSTGRES_DB: travel_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      minio:
        image: minio/minio:RELEASE.2024-12-13T22-19-12Z
        env:
          MINIO_ROOT_USER: minio
          MINIO_ROOT_PASSWORD: minio_ci_password
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        # MinIO needs the `server` arg + a data dir to actually
        # serve. GitHub `services:` lacks a custom command field,
        # so we use the default startup which loads `--data-dir`
        # from MINIO_VOLUMES env. Default data dir works for tests.

    env:
      NODE_ENV: test
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://travel:travel_dev@localhost:5432/travel_dev
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: travel-ci
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_ci_password
      JWT_ACCESS_SECRET: ci_access_secret_min_32_chars_padding_xx
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_chars_padding_y
      MEILI_MASTER_KEY: meili_ci_master_key_min_16_chars
      RATE_LIMIT_PEPPER: ci_pepper_value_min_32_chars_padding_zz
      CORS_ORIGINS: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist'd workspace packages
        run: pnpm turbo run build --filter='@app/*'

      - name: Generate Prisma client
        run: pnpm --filter=api run db:generate

      - name: Apply Prisma migrations
        run: pnpm --filter=api run db:migrate:deploy

      - name: Run integration tests
        run: pnpm --filter=api test -- --ci --runInBand

      - name: Summary
        if: always()
        run: |
          echo "### Integration tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ All integration tests pass." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Integration test regression — see job log above." >> "$GITHUB_STEP_SUMMARY"
          fi
