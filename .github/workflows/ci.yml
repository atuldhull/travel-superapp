name: ci

# Minimal "essentials" gate. The full enterprise pipeline (deploy, mobile
# EAS, Chromatic, security scanners, smoke/e2e/load, etc.) lives under
# `.github/workflows-disabled/` and needs cloud infra + secrets that aren't
# provisioned yet — re-enable those files one at a time as you wire each
# service up. This gate only runs checks that pass without any infra.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (web)
        run: pnpm --filter=web typecheck

      - name: Unit tests (canvas-shared)
        run: pnpm --filter=@app/aether-canvas-shared test
