# Quarantine — runs known-flaky tests informationally ([L6]).
#
# When a test is moved into `apps/api/test/quarantine/`, the main
# `tests` job stops running it (so it can't block PRs). THIS job
# runs only those tests, on every PR + push to main, but its
# failure is informational — `continue-on-error: true` keeps the
# overall pipeline green.
#
# Goal: the broken state stays VISIBLE (failed-quarantine annotation
# on every PR + nightly summary) rather than SILENT (the I1/L1
# skip-pass anti-pattern the L-series was about removing).
name: quarantine

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly run — flake patterns sometimes only show up under
    # certain CPU / disk pressure that PR queue load creates.
    - cron: '15 4 * * *'
  workflow_dispatch:

concurrency:
  group: quarantine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Informational only — never blocks PR merge.
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel_dev
          POSTGRES_DB: travel_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U travel -d travel_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://travel:travel_dev@127.0.0.1:5432/travel_dev?schema=public
      DIRECT_URL: postgresql://travel:travel_dev@127.0.0.1:5432/travel_dev?schema=public
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter=api run db:generate

      - name: Apply migrations
        run: pnpm --filter=api run db:migrate:deploy

      - name: Run quarantined tests (informational)
        run: |
          # If there's nothing to quarantine, the config matches no
          # files; jest --passWithNoTests turns that into a green run.
          pnpm --filter=api exec jest \
            --config jest.config.quarantine.cjs \
            --ci \
            --passWithNoTests || true

      - name: Summary
        if: always()
        run: |
          echo "### Quarantine" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          count=$(find apps/api/test/quarantine -name '*.spec.ts' -not -name 'README*' 2>/dev/null | wc -l)
          echo "$count quarantined spec(s) under \`apps/api/test/quarantine/\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            find apps/api/test/quarantine -name '*.spec.ts' -not -name 'README*' | sed 's|^| - `|;s|$|`|' >> "$GITHUB_STEP_SUMMARY"
          fi
