# deploy-workers — independently deploys each Node worker to Fly.
#
# Triggers:
#   - push to main that touches a worker's source / Dockerfile / fly.toml
#   - manual `workflow_dispatch` with a `worker` choice
#
# Each worker has its own Fly app (see ops/terraform/workers.tf) and
# its own fly.toml in apps/<worker>/fly.toml. `flyctl deploy -c <toml>`
# from the repo root builds the Dockerfile (which uses the repo root
# as build context for workspace resolution) and ships the image.
#
# Operator-owed:
#   - `FLY_API_TOKEN` repo secret with deploy scope on the worker apps
#   - Workers' Fly apps created (one-time): `flyctl apps create -o <org> travel-<name>-{worker,service}-{staging,prod}`
#   - Doppler-synced secrets for each app (REDIS_URL minimum)
#
# Installed by [Q4] of the Scale-readiness 3→10 series.

name: deploy-workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/notification-worker/**'
      - 'apps/media-service/**'
      - 'apps/crawler-worker/**'
      - 'packages/jobs/**'
      - 'packages/logger/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which worker(s) to deploy'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - notification-worker
          - media-service
          - crawler-worker
      environment:
        description: 'Target environment'
        type: choice
        required: true
        default: 'staging'
        options: [staging, production]

concurrency:
  group: deploy-workers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Which workers changed?
    runs-on: ubuntu-latest
    outputs:
      notification: ${{ steps.filter.outputs.notification }}
      media: ${{ steps.filter.outputs.media }}
      crawler: ${{ steps.filter.outputs.crawler }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            notification:
              - 'apps/notification-worker/**'
              - 'packages/jobs/**'
              - 'packages/logger/**'
              - 'pnpm-lock.yaml'
            media:
              - 'apps/media-service/**'
              - 'packages/jobs/**'
              - 'packages/logger/**'
              - 'pnpm-lock.yaml'
            crawler:
              - 'apps/crawler-worker/**'
              - 'packages/jobs/**'
              - 'packages/logger/**'
              - 'pnpm-lock.yaml'

  deploy:
    name: ${{ matrix.worker }} → ${{ matrix.env }}
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - worker: notification-worker
            dir: notification-worker
            changed: ${{ needs.detect.outputs.notification }}
          - worker: media-service
            dir: media-service
            changed: ${{ needs.detect.outputs.media }}
          - worker: crawler-worker
            dir: crawler-worker
            changed: ${{ needs.detect.outputs.crawler }}
    env:
      WORKER: ${{ matrix.worker }}
      DIR: ${{ matrix.dir }}
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      matrix.changed == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Skip if dispatched for a different worker
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.worker != 'all' && github.event.inputs.worker != matrix.worker
        run: |
          echo "Skipping ${{ matrix.worker }} — dispatcher targeted ${{ github.event.inputs.worker }}"
          exit 0

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Compute target app name
        id: target
        run: |
          # The fly.toml carries the staging app name as default; for
          # production we replace `-staging` with `-prod`.
          STAGING_APP=$(awk -F'"' '/^app = / { print $2 }' "apps/${DIR}/fly.toml")
          if [ "$ENVIRONMENT" = "production" ]; then
            APP="${STAGING_APP/-staging/-prod}"
          else
            APP="$STAGING_APP"
          fi
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "deploying to $APP"

      - name: Deploy
        run: |
          flyctl deploy \
            --config "apps/${DIR}/fly.toml" \
            --app "${{ steps.target.outputs.app }}" \
            --dockerfile "apps/${DIR}/Dockerfile" \
            --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
