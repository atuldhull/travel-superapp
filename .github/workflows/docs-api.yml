# docs-api — publish the OpenAPI reference to GitHub Pages.
#
# Steps:
#   1. Boot AppModule, regenerate docs/api/openapi.yaml (`pnpm api:openapi`).
#   2. Build the offline-capable Redoc bundle (`pnpm docs:api:build`).
#   3. Stage docs/api/ as the Pages artifact and deploy.
#
# Runs:
#   - on every push to main that touches the spec, a controller, or the
#     viewer config (so the published page is always the latest)
#   - on workflow_dispatch (manual re-publish)
#
# Operator-owed (one-time): enable GitHub Pages in repo Settings → Pages
# → Source = "GitHub Actions". Until that's done, the deploy step fails
# with a clear error — the build step still works locally + as PR smoke.
#
# Installed by [P3] of the Documentation 8.5→10 series.

name: docs-api

on:
  push:
    branches: [main]
    paths:
      - 'docs/api/**'
      - 'apps/api/src/**/*.controller.ts'
      - 'apps/api/scripts/export-openapi.ts'
      - 'packages/shared-types/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docs-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'docs-api'
  cancel-in-progress: true

jobs:
  build:
    name: Build OpenAPI reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate openapi.yaml
        run: pnpm --filter=api api:openapi

      - name: Build Redoc bundle
        run: pnpm docs:api:build

      - name: Stage Pages artifact
        run: |
          mkdir -p _site
          cp docs/api/openapi.yaml _site/openapi.yaml
          cp docs/api/index.html _site/index.html
          cp docs/api/index.bundled.html _site/index.bundled.html
          cp docs/api/README.md _site/README.md

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
