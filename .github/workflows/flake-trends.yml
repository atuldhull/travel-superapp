# Flake trends ([M3]) — nightly aggregator of jest-junit artifacts
# from the past N days of `tests` jobs. Surfaces "this test failed
# X of last 10 runs" as a step-summary table so flakes are VISIBLE
# without paying for a dashboard.
#
# Why this exists: the L-series replaced silent skip-pass with
# explicit run-and-fail. THIS workflow adds the second half —
# trend visibility — so a test that fails 3 of 10 runs gets seen
# even when each individual run is informationally green
# (quarantine.yml) or temporarily red.
#
# Data flow:
#   ci.yml `tests` job  →  uploads `junit-shard-N` per shard per run
#   THIS workflow       →  lists last 10 days of those artifacts,
#                          downloads them, parses every <testcase>,
#                          tallies pass/fail per <classname>::<name>,
#                          prints top 10 flakes to step summary.
#
# Cost: $0. Free GH Actions minutes + artifact storage (retention
# already 14d on the upload). No SaaS, no token.
#
# Installed by [M3] — closes #8 of the road-to-10 Test/CI list.
name: flake-trends

on:
  schedule:
    # 05:30 UTC nightly — runs after the 04:15 quarantine job so
    # both feeds are in sync for the same calendar day.
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: flake-trends-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download last 10 days of junit artifacts
        # Use the GH CLI to list `tests` workflow runs from the past
        # 10 days, then download every `junit-shard-*` artifact into
        # `./junit-artifacts/<run-id>/`. The aggregator script reads
        # the whole directory tree.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p junit-artifacts
          # Last 10 days of completed runs of the `ci` workflow:
          since=$(date -u -d '10 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # `--limit 200` covers a busy week of PRs without paginating.
          run_ids=$(gh run list \
            --workflow=ci.yml \
            --limit 200 \
            --json databaseId,createdAt \
            --jq ".[] | select(.createdAt >= \"$since\") | .databaseId")
          count=0
          for run_id in $run_ids; do
            # Each run has 4 junit-shard-* artifacts (one per shard).
            # `--pattern junit-shard-*` filters; tolerant of runs that
            # didn't produce any (older runs from before [M3] landed).
            if gh run download "$run_id" \
                --dir "junit-artifacts/$run_id" \
                --pattern 'junit-shard-*' 2>/dev/null; then
              count=$((count + 1))
            fi
          done
          echo "Downloaded artifacts from $count run(s)."

      - name: Aggregate flake rates
        run: |
          node scripts/aggregate-flakes.mjs junit-artifacts > flake-report.md
          cat flake-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flake-report
          path: flake-report.md
          retention-days: 30
