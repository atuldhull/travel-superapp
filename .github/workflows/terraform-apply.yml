# Terraform apply ([N3]).
#
# Manual workflow_dispatch only — picks staging or production. No
# auto-apply on push because Fly's eventual-consistent API makes
# noisy reruns risky (re-creating a machine resource churns user
# traffic). The pattern is: PR → terraform-plan → review → merge to
# main → manually trigger this with `environment=staging` → smoke →
# trigger again with `environment=production`.
#
# Required GitHub repo secrets:
#   FLY_API_TOKEN              — short-lived `flyctl tokens create deploy`
#   DOPPLER_TOKEN              — read-only token scoped to the right config
#
# Doppler is the source of secrets at apply time. `doppler secrets
# download --no-file` injects them into the shell as env vars that
# match the `TF_VAR_<name>` convention.
name: terraform-apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'staging or production'
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }} # GH Environment for manual approval gate
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Install doppler CLI
        run: |
          curl -Ls --tlsv1.2 --proto "=https" --retry 3 \
            https://cli.doppler.com/install.sh | sh

      - name: Pull secrets from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DOPPLER_PROJECT: travel-api
          DOPPLER_CONFIG: ${{ inputs.environment }}
        run: |
          # Emit `TF_VAR_<name>=<value>` for each secret; Terraform
          # auto-reads those at plan/apply time.
          doppler secrets download --no-file --format=docker \
            | sed 's/^/TF_VAR_/' \
            | sed 's/=/="/' \
            | sed 's/$/"/' \
            >> "$GITHUB_ENV"

      - name: Init
        working-directory: ops/terraform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: terraform init

      - name: Plan
        working-directory: ops/terraform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          terraform plan \
            -var-file=envs/${{ inputs.environment }}.tfvars \
            -out=plan.bin

      - name: Apply
        working-directory: ops/terraform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: terraform apply -auto-approve plan.bin

      - name: Summarise
        if: always()
        working-directory: ops/terraform
        run: |
          echo "### Terraform apply — \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Applied. Run \`fly status --app travel-api-${{ inputs.environment == 'production' && 'prod' || 'staging' }}\` to confirm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Apply failed. Check job log + revert via \`terraform apply -refresh-only\` if state drift is the cause." >> "$GITHUB_STEP_SUMMARY"
          fi
