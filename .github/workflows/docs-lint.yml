# docs-lint — keep documentation honest.
#
# Three independent gates:
#   1. markdownlint-cli2  — structural markdown lint (heading order,
#                           list spacing, no trailing whitespace, etc.)
#   2. lychee link-check  — fail on dead http(s) / file-relative links
#                           across the repo's markdown
#   3. env-drift gate     — `pnpm` script ensures docs/env.md is in
#                           sync with packages/config/src/schema.ts
#
# Runs on every PR that touches markdown, the env schema, or the docs
# config. Fast (~60s) — uses npx + cached lychee results.
#
# Installed by [P6] of the Documentation 8.5→10 series.

name: docs-lint

on:
  pull_request:
    paths:
      - '**/*.md'
      - '.markdownlint-cli2.jsonc'
      - 'lychee.toml'
      - 'docs/env.md'
      - 'packages/config/src/schema.ts'
      - 'scripts/docs-env-check.cjs'
      - 'scripts/docs-emit-erd.mjs'
      - '.github/workflows/docs-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint-cli2
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run markdownlint
        run: npx -y markdownlint-cli2 "**/*.md" "#node_modules"

  lychee:
    name: lychee link-check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Restore lychee cache
        uses: actions/cache@v5
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: |
            lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress './**/*.md'
          fail: true

  env-drift:
    name: env schema vs docs/env.md
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node scripts/docs-env-check.cjs
