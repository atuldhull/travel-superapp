# Quarterly secret-rotation reminder ([N6]).
#
# This workflow does NOT auto-rotate prod secrets — that path needs
# an admin bearer + a Supabase 2FA click that don't belong in CI.
# Instead it OPENS A TRACKING ISSUE every quarter listing the secrets
# that are due, with one-click commands for each. The on-call closes
# the issue once each rotation has been recorded in
# `docs/dr-drills/` (DR drill) or via the audit-log endpoint.
#
# Schedule: every 90 days at 09:00 UTC on a Tuesday. Manual
# workflow_dispatch supported for ad-hoc rotation rounds.
name: secret-rotation

on:
  schedule:
    # First Tuesday of every quarter (approximately) — Tuesday avoids
    # Monday-after-weekend chaos and Friday "ship-it" pressure.
    - cron: '0 9 1-7 1,4,7,10 2'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-rotation-ticket:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Open / update rotation ticket
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const q = Math.floor(now.getUTCMonth() / 3) + 1;
            const title = `Quarterly secret rotation — ${now.getUTCFullYear()} Q${q}`;
            const body = [
              `Reminder: it's time to rotate the routine secrets. Mark each box as done.`,
              ``,
              `## Routine rotations`,
              `- [ ] JWT_ACCESS  ring (staging)  — \`./scripts/secrets/rotate-jwt-keyring.sh staging access\``,
              `- [ ] JWT_REFRESH ring (staging)  — \`./scripts/secrets/rotate-jwt-keyring.sh staging refresh\``,
              `- [ ] JWT_ACCESS  ring (prod)     — \`./scripts/secrets/rotate-jwt-keyring.sh prod access\``,
              `- [ ] JWT_REFRESH ring (prod)     — \`./scripts/secrets/rotate-jwt-keyring.sh prod refresh\``,
              `- [ ] Supabase DB pw (staging)    — \`./scripts/secrets/rotate-supabase-password.sh staging '<new-pw>'\``,
              `- [ ] Supabase DB pw (prod)       — \`./scripts/secrets/rotate-supabase-password.sh prod '<new-pw>'\``,
              `- [ ] S3 / R2 access key (staging) — provider dashboard → rotate → push via \`fly secrets set\``,
              `- [ ] S3 / R2 access key (prod)    — provider dashboard → rotate → push via \`fly secrets set\``,
              `- [ ] FLY_API_TOKEN (CI)          — \`flyctl tokens create deploy --name ci-$(date +%Y-%m-%d)\``,
              `- [ ] DOPPLER_TOKEN (CI)          — Doppler dashboard → Service Tokens → rotate`,
              ``,
              `## Verify`,
              `- [ ] /health/ready 200 on staging + prod after each rotation`,
              `- [ ] Sentry error rate unchanged for 24h post-rotation`,
              ``,
              `## Notes`,
              `Pepper rotations (EMAIL_PEPPER, RATE_LIMIT_PEPPER, BACKUP_CODE_PEPPER)`,
              `are NOT routine — they invalidate hashed lookups + MFA codes`,
              `respectively. Rotate only on a confirmed leak; the rotation`,
              `runbook for each is in [docs/runbooks/secrets.md](../docs/runbooks/secrets.md).`,
              ``,
              `Cross-ref: [docs/runbooks/secrets.md](../docs/runbooks/secrets.md), [docs/runbooks/backups-dr.md](../docs/runbooks/backups-dr.md).`,
            ].join('\n');

            // Look for an existing open issue with the same title — if
            // re-running the workflow this quarter, update rather than
            // create a duplicate.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'rotation',
            });
            const match = existing.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
              console.log(`updated existing issue #${match.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body,
                labels: ['rotation', 'ops'],
              });
              console.log('created new rotation ticket');
            }
