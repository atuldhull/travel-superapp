# CI cost watch ([N11]) — daily check of GitHub Actions minute spend.
#
# Pulls `/orgs/<org>/settings/billing/actions` (or
# `/users/<user>/settings/billing/actions` for personal repos) and
# alerts when monthly usage exceeds the configured budget.
#
# Why this exists: the `tests` job uses a 4-shard matrix that bills
# 4× regular minutes. A single flaky workflow loop can burn 200+
# minutes/day. The repo-level spending cap (Settings → Billing) is
# the hard stop; THIS workflow is the warn-before-stop layer.
#
# The repo owner sets a `GH_BILLING_TOKEN` repo secret with the
# `read:org` + `repo` scopes (a PAT, not the workflow token —
# `GITHUB_TOKEN` doesn't have billing read permissions).
# Without that token the workflow logs a notice and exits 0.
name: ci-cost-watch

on:
  schedule:
    - cron: '15 8 * * *' # daily, 08:15 UTC
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: 'Monthly minute budget (default 2000 — GH free tier)'
        required: false
        default: '2000'

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUDGET_MINUTES: ${{ inputs.budget_minutes || '2000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe GitHub Actions billing
        id: probe
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_BILLING_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const budget = parseInt(process.env.BUDGET_MINUTES, 10);
            const { owner } = context.repo;
            let usage;
            try {
              // For org-owned repos.
              const { data } = await github.request(
                'GET /orgs/{org}/settings/billing/actions',
                { org: owner },
              );
              usage = data;
            } catch (_) {
              try {
                // Fallback for user-owned repos.
                const { data } = await github.request(
                  'GET /users/{username}/settings/billing/actions',
                  { username: owner },
                );
                usage = data;
              } catch (e) {
                core.notice(
                  `GitHub billing API unavailable for ${owner} — likely missing scope on GH_BILLING_TOKEN. Skipping.`,
                );
                return { skipped: true };
              }
            }
            const usedMin = usage.total_minutes_used || 0;
            const pct = (usedMin / budget) * 100;
            core.summary
              .addHeading(`CI cost watch — ${owner}`)
              .addTable([
                [{ data: 'Field', header: true }, { data: 'Value', header: true }],
                ['Budget (minutes)', String(budget)],
                ['Used (this billing cycle)', String(usedMin)],
                ['Used %', pct.toFixed(1) + '%'],
                ['Included paid minutes', String(usage.included_minutes ?? 'n/a')],
                ['Paid overage', String(usage.total_paid_minutes_used ?? 0)],
              ])
              .write();
            core.setOutput('used_pct', pct.toFixed(1));
            core.setOutput('used_min', String(usedMin));
            core.setOutput('skipped', 'false');
            return { skipped: false, usedMin, pct };

      - name: Open / update budget-warning issue (≥ 80%)
        if: steps.probe.outputs.skipped == 'false' && steps.probe.outputs.used_pct >= 80
        uses: actions/github-script@v7
        with:
          script: |
            const usedPct = '${{ steps.probe.outputs.used_pct }}';
            const usedMin = '${{ steps.probe.outputs.used_min }}';
            const title = `CI cost over 80% of budget — ${new Date().toISOString().slice(0, 7)}`;
            const body = [
              `GitHub Actions minute usage is at **${usedPct}%** of budget (${usedMin} min used).`,
              ``,
              `Most likely cause: the \`tests\` 4-shard matrix is the dominant cost. To reduce burn:`,
              ``,
              `1. Lower shard count temporarily (\`strategy.matrix.shard: [1, 2]\` in ci.yml).`,
              `2. Move heavier jobs (mutation, e2e) to a nightly cron instead of every-push.`,
              `3. Audit cron-triggered workflows for runaway loops.`,
              ``,
              `Runbook: [docs/runbooks/cost-monitoring.md](docs/runbooks/cost-monitoring.md).`,
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cost-watch',
            });
            const match = existing.data.find((i) => i.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: match.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['cost-watch', 'ops'],
              });
            }
