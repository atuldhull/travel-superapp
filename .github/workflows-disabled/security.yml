# Security scanning — runs on every PR + every push to main + on a
# weekly schedule so newly-disclosed CVEs surface even on unchanged
# branches.
#
# Three independent jobs, each contributing a different angle:
#
#   1. gitleaks — secret-scan the repo + git history. Catches leaked
#      JWT secrets, API keys, MFA TOTP seeds, S3 access keys before
#      they land in main.
#
#   2. pnpm-audit — transitive-vuln scan of the resolved dependency
#      graph. Reports HIGH+ severity CVEs as a job failure; LOW/MOD
#      surface in the run summary but don't block.
#
#   3. trivy-fs — filesystem scan covering misconfigured Dockerfiles,
#      vulnerable lockfile entries, and known-bad image bases. Output
#      uploaded as SARIF so GitHub's Security tab renders it.
#
# Independent of `ci.yml` so a flaky security scan (e.g. a Trivy DB
# update transient) doesn't block code merges. Failures are signal,
# not gate — except for gitleaks, which IS a hard gate.
#
# Installed by prompt [IV.18.19.3].

name: security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Monday 03:00 UTC — after weekend CVE disclosures
    # land but before the work-week wakes up.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ──────────────────────────────────────────────────────────────
  # Gitleaks — secret-scan repo + history. Hard gate: any leaked
  # secret blocks the merge.
  # ──────────────────────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # Full history needed for a meaningful scan — gitleaks
          # walks every commit, not just the diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE — public-repo terms apply. Custom
          # rules (e.g. project-specific `JWT_*_SECRET` patterns)
          # land in `.gitleaks.toml` if/when noise levels demand.

  # ──────────────────────────────────────────────────────────────
  # pnpm audit — transitive-vuln scan. Soft gate on LOW/MODERATE,
  # hard gate on HIGH+.
  # ──────────────────────────────────────────────────────────────
  pnpm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (HIGH+ blocks)
        # Exit non-zero only on HIGH/CRITICAL — moderate/low vulns
        # surface in logs but don't fail the run. Adjust the floor
        # by editing `--audit-level`; current posture is "ship-now,
        # tighten later".
        run: pnpm audit --audit-level=high

      - name: Audit (full report — informational)
        if: always()
        run: pnpm audit || true

  # ──────────────────────────────────────────────────────────────
  # Trivy filesystem scan. SARIF upload for the GitHub Security tab.
  # ──────────────────────────────────────────────────────────────
  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
