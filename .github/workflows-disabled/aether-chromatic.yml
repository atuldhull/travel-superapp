name: aether-chromatic

# Visual-regression check for @app/aether-* via Chromatic.
# Runs on every PR that touches the Aether packages or the storybook
# app. Skipped on main (Chromatic auto-accepts main baselines).
#
# Setup:
#   1. Sign up at chromatic.com, create a project under apps/aether-storybook.
#   2. Add the project token to GitHub repo secrets as CHROMATIC_PROJECT_TOKEN.
#   3. First run on main baselines the visual story; subsequent PRs diff
#      against that baseline and fail this gate if a story changes pixels.

on:
  pull_request:
    paths:
      - 'packages/aether-motion/**'
      - 'packages/aether-core/**'
      - 'packages/aether-canvas/**'
      - 'apps/aether-storybook/**'
      - '.github/workflows/aether-chromatic.yml'
  push:
    branches: [main]
    paths:
      - 'packages/aether-motion/**'
      - 'packages/aether-core/**'
      - 'packages/aether-canvas/**'
      - 'apps/aether-storybook/**'

jobs:
  chromatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full history to compute baselines.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter aether-storybook build-storybook
      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/aether-storybook
          storybookBuildDir: storybook-static
          # Exit 0 on visual changes — they show as comments on the PR,
          # blocking merge happens via Chromatic's GitHub check instead.
          exitZeroOnChanges: true
