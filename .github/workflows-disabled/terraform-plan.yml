# Terraform plan ([N3]).
#
# Runs `terraform plan` on every PR that touches `ops/terraform/`,
# posting the diff back as a PR comment. NEVER applies — apply lives
# in `terraform-apply.yml` and runs only on a manual workflow_dispatch
# OR on a tagged `infra/*` release.
#
# Auth: Fly tokens are short-lived deploy tokens (not OIDC — Fly
# doesn't yet support GitHub OIDC at TF apply granularity). The
# token is scoped to the org via `FLY_API_TOKEN` repo secret. CI's
# blast radius is bounded by the staging-only `-var-file`.
name: terraform-plan

on:
  pull_request:
    paths:
      - 'ops/terraform/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, production]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: true

      - name: Format check
        working-directory: ops/terraform
        run: terraform fmt -check -recursive

      - name: Init
        working-directory: ops/terraform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: terraform init -backend=false # plan-only; local state ok

      - name: Validate
        working-directory: ops/terraform
        run: terraform validate

      - name: Plan (${{ matrix.env }})
        id: plan
        working-directory: ops/terraform
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          terraform plan \
            -var-file=envs/${{ matrix.env }}.tfvars \
            -no-color \
            -out=plan-${{ matrix.env }}.bin \
            2>&1 | tee plan-${{ matrix.env }}.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = '${{ matrix.env }}';
            const plan = fs.readFileSync(`ops/terraform/plan-${env}.txt`, 'utf8');
            // Truncate to fit the GH comment limit.
            const truncated = plan.length > 60_000
              ? plan.slice(0, 60_000) + '\n\n…(truncated, see job log)…'
              : plan;
            const body = `### Terraform plan — \`${env}\`\n\n<details><summary>Plan output</summary>\n\n\`\`\`hcl\n${truncated}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
