; PgBouncer config for the local dev stack ([Q1] scale-readiness).
;
; Mirrors the Supabase prod posture: TRANSACTION-mode pooling on
; port 6543, with a small (default 25) physical connection pool sitting
; in front of Postgres on 5432. The api connects to 6543 (DATABASE_URL);
; `prisma migrate` connects to 5432 (DIRECT_URL).
;
; Why transaction-mode (not session): a NestJS request is short-lived;
; transaction-mode reuses a backend the moment a client commits, which
; lets us serve 1000s of clients on top of ~25 backends. Session-mode
; would pin a backend for the lifetime of a client connection — the
; whole reason this matters is that DOES NOT scale.
;
; Why Prisma needs `?pgbouncer=true`: prepared statements + session-
; state-bound features (advisory locks, LISTEN/NOTIFY, SET LOCAL) do
; not survive a backend swap. The flag tells Prisma to disable prepared
; statements at the client. https://prisma.io/docs/orm/prisma-client/setup-and-configuration/databases-connections/pgbouncer

[databases]
travel_dev = host=postgres port=5432 dbname=travel_dev

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6543
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; TRANSACTION-mode pooling — see header.
pool_mode = transaction

; 25 physical backends — Supabase default for the Pro plan. Sized
; well below Postgres `max_connections = 100` so other clients
; (admin console, migrate, replicas) still get connections.
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Per-pool defaults that prevent a stuck client from holding a backend.
max_client_conn = 1000
server_idle_timeout = 60
server_lifetime = 1800
query_wait_timeout = 30

; TLS off in dev. Prod (Supabase) terminates TLS at the pooler edge.
client_tls_sslmode = disable

; Verbose enough to debug; quiet enough not to flood.
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0

; Admin queue — `SHOW POOLS;` works for the `pgbouncer_admin` user.
admin_users = pgbouncer_admin
stats_users = pgbouncer_admin

; Prisma's prepared-statement workaround relies on the client sending
; `?pgbouncer=true` — this server-side setting belt-and-braces it.
ignore_startup_parameters = extra_float_digits,search_path
