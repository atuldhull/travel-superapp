# Prometheus config ([N1]) — scrapes the api's `/metrics` endpoint
# every 15s. `host.docker.internal` reaches the host where `pnpm
# --filter=api dev` is running. Adjust the target if the api binds
# elsewhere.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'travel-api'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'host.docker.internal:3000'
        labels:
          service: api
          environment: dev

  # Tempo + Prometheus self-scrape so the stack is observable too.
  - job_name: 'tempo'
    static_configs:
      - targets:
          - 'tempo:3200'
        labels:
          service: tempo
          environment: dev

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          service: prometheus
          environment: dev

# Alert-rule files are mounted from `ops/prometheus/rules/` and are
# wired in [N2]. Path is /etc/prometheus/rules/*.yml; an empty
# directory is fine — Prometheus boots cleanly without rules.
rule_files:
  - /etc/prometheus/rules/*.yml
