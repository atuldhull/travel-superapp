[project]
name = "ai-service"
version = "0.1.0"
description = "Python FastAPI sidecar for TravelSuperApp — hosts ML inference. Stub-only today; real models land in [IV.18.2.11]."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-exporter-otlp-proto-http==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    # httpx is the async HTTP client we use to talk to Ollama (embeddings)
    # and Argos (translate, optional). Promoted from dev to main in [S-A1].
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "ruff==0.8.4",
]
# Real translation backend (Argos) is OPTIONAL — installing it pulls a
# ~500MB model per language pair on first use. The Dockerfile can opt-in via
# `pip install '.[translate]'`. Without it, /v1/translate falls back to echo.
translate = [
    "argostranslate==1.9.6",
]
# Real STT backend (faster-whisper) is OPTIONAL — base.en model is ~150MB,
# medium is ~1.5GB. The Dockerfile can opt-in via `pip install '.[stt]'`.
# Without it, /v1/transcribe returns empty STTPartial so the contract holds.
stt = [
    "faster-whisper==1.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_service*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py *_test.py"
