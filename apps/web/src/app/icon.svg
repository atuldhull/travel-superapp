<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TravelSuperApp">
  <!--
    I6/verification (Phase 6) — favicon. Next's `app/icon.svg`
    convention auto-injects `<link rel="icon">` on every page; the
    app previously had no favicon at all. Bold compass mark so it
    still reads at 16px: gold square, thick white ring + needle.
  -->
  <defs>
    <linearGradient id="fav" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9c987" />
      <stop offset="100%" stop-color="#cdab63" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fav)" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fdfcf9" stroke-width="4.5" />
  <polygon points="32,15 39,32 32,49 25,32" fill="#fdfcf9" stroke="#161310" stroke-width="1.5"
    stroke-linejoin="round" />
  <circle cx="32" cy="32" r="3.2" fill="#161310" />
</svg>
