<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="TravelSuperApp icon">
  <!-- Outer rounded square as a backdrop. Gold-on-ivory brand. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9c987" />
      <stop offset="100%" stop-color="#cdab63" />
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#g)" />
  <!-- A simple compass-needle glyph: north-pointing diamond inside a ring. -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#fdfcf9" stroke-width="14" />
  <polygon
    points="256,128 296,256 256,384 216,256"
    fill="#fdfcf9"
    stroke="#161310"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <circle cx="256" cy="256" r="14" fill="#161310" />
</svg>
