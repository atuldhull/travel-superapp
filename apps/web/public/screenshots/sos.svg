<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-label="Mock screenshot of the SOS hold-to-confirm pill in mid-progress">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef2f2"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="bg3dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="14" fill="url(#bg3dark)"/>

  <!-- Mock browser chrome (light, thin) -->
  <rect x="20" y="20" width="560" height="32" rx="6" fill="#ffffff" opacity="0.05"/>
  <circle cx="36" cy="36" r="5" fill="#ef4444"/>
  <circle cx="52" cy="36" r="5" fill="#f59e0b"/>
  <circle cx="68" cy="36" r="5" fill="#22c55e"/>

  <!-- Top "Active SOS" banner -->
  <rect x="20" y="68" width="560" height="60" rx="8" fill="#dc2626"/>
  <text x="40" y="92" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">🆘 SOS active — trusted contacts notified</text>
  <text x="40" y="110" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#fee2e2">Triggered 0:32 ago · Local emergency: 112 (PT)</text>
  <rect x="450" y="84" width="100" height="28" rx="4" fill="#10b981"/>
  <text x="463" y="101" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff">I'm OK — cancel</text>

  <!-- Trusted contact list -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#e5e7eb">
    <text x="40" y="160" font-weight="600">Notified trusted contacts</text>
    <rect x="40" y="172" width="520" height="32" rx="4" fill="#374151" stroke="#4b5563"/>
    <text x="56" y="192" fill="#ffffff">Mom</text>
    <text x="200" y="192" fill="#9ca3af">+1 415 555 0123</text>
    <text x="490" y="192" fill="#34d399">✓ delivered</text>

    <rect x="40" y="212" width="520" height="32" rx="4" fill="#374151" stroke="#4b5563"/>
    <text x="56" y="232" fill="#ffffff">Sister</text>
    <text x="200" y="232" fill="#9ca3af">+1 415 555 0987</text>
    <text x="490" y="232" fill="#34d399">✓ delivered</text>

    <rect x="40" y="252" width="520" height="32" rx="4" fill="#374151" stroke="#4b5563"/>
    <text x="56" y="272" fill="#ffffff">Roommate</text>
    <text x="200" y="272" fill="#9ca3af">+1 415 555 0444</text>
    <text x="490" y="272" fill="#fbbf24">⏳ pending</text>
  </g>

  <!-- SOS pill bottom-right (mid-hold, 70% conic fill) -->
  <g transform="translate(500,310)">
    <circle r="32" fill="#dc2626"/>
    <!-- 70% white arc to mimic conic gradient progress -->
    <path d="M 0 -32 A 32 32 0 0 1 30.4 -10.0 L 0 0 Z" fill="#ffffff" opacity="0.85"/>
    <text y="4" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">🆘</text>
    <text y="20" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="8" fill="#ffffff">70%</text>
  </g>
</svg>
