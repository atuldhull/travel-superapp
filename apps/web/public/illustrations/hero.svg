<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Stylised travel scene with mountains, route arc, paper plane, and itinerary card">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="mountain3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="480" height="360" rx="20" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="380" cy="90" r="80" fill="url(#sun)" opacity="0.8"/>
  <circle cx="380" cy="90" r="36" fill="#fcd34d" opacity="0.95"/>

  <!-- Far mountains -->
  <path d="M 0 230 L 80 160 L 130 200 L 200 130 L 280 200 L 360 150 L 480 220 L 480 360 L 0 360 Z" fill="url(#mountain3)" opacity="0.55"/>

  <!-- Mid mountains -->
  <path d="M 0 270 L 60 210 L 130 240 L 200 180 L 270 235 L 360 200 L 480 270 L 480 360 L 0 360 Z" fill="url(#mountain2)" opacity="0.75"/>

  <!-- Near mountains -->
  <path d="M 0 310 L 70 260 L 150 290 L 220 250 L 320 290 L 400 260 L 480 305 L 480 360 L 0 360 Z" fill="url(#mountain1)"/>

  <!-- Snow caps -->
  <path d="M 195 130 L 215 145 L 200 150 L 185 145 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 78 160 L 95 175 L 80 178 L 65 175 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Route arc -->
  <path d="M 50 280 Q 200 60 430 110" stroke="#1d4ed8" stroke-width="3" fill="none" stroke-dasharray="6 4" stroke-linecap="round"/>

  <!-- Paper plane at end of arc -->
  <g transform="translate(430,110) rotate(20)">
    <path d="M -16 0 L 16 -8 L 8 0 L 16 8 Z" fill="#1d4ed8"/>
    <path d="M 0 0 L 16 -8 L 8 0 Z" fill="#2563eb"/>
  </g>

  <!-- Pin at start -->
  <g transform="translate(50,280)">
    <circle r="8" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <circle r="3" fill="#1d4ed8"/>
  </g>

  <!-- Itinerary card overlay -->
  <g transform="translate(40,200)">
    <rect width="200" height="120" rx="12" fill="url(#card)" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="28" rx="12" fill="#2563eb"/>
    <rect x="0" y="16" width="200" height="12" fill="#2563eb"/>
    <text x="14" y="20" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#ffffff">DAY 1 · LISBON</text>
    <g font-family="Inter, system-ui, sans-serif" font-size="11" fill="#0f172a">
      <circle cx="14" cy="50" r="3" fill="#2563eb"/>
      <text x="24" y="53">Tram 28 to Alfama</text>
      <circle cx="14" cy="70" r="3" fill="#2563eb"/>
      <text x="24" y="73">Pastéis de Belém</text>
      <circle cx="14" cy="90" r="3" fill="#2563eb"/>
      <text x="24" y="93">Sunset at Miradouro</text>
    </g>
    <text x="14" y="112" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#64748b">☀ 24°C · 🚖 €8 avg · ⚠ low risk</text>
  </g>
</svg>
