<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TravelSuperApp API</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="OpenAPI 3 reference for the TravelSuperApp api. Generated by `pnpm api:openapi` from apps/api at build time; rendered with Redoc."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E"
    />
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      /* Loading indicator while Redoc fetches openapi.yaml + the JS bundle. */
      #loading {
        padding: 2rem 1.5rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading TravelSuperApp API reference…</div>
    <redoc spec-url="./openapi.yaml"></redoc>
    <!--
      Redoc standalone bundle. The browser fetches openapi.yaml at page-load,
      so there is no drift between this HTML and the spec — regenerating
      openapi.yaml is enough.

      To browse offline / without a CDN, run:
        pnpm docs:api:build       # writes docs/api/index.bundled.html (~1.8 MB)
      That bundled file inlines both Redoc + the spec into a single asset.
    -->
    <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
