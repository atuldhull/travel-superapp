info:
  title: TravelSuperApp API
  description: OpenAPI export from the running NestJS app. Per-route schemas land
    progressively as @ApiBody / @ApiResponse decorators get added module by
    module — see docs/api/README.md.
  version: v1
  contact: {}
tags:
  - name: identity
    description: Auth, sessions, profile, MFA
  - name: trip
    description: Trip CRUD, itinerary, sharing, overview composite
  - name: media
    description: Media uploads, memory books
  - name: social
    description: Reviews, votes, expenses, balances
  - name: notifications
    description: Inbox + delivery channels
  - name: admin
    description: Operator-only moderation surfaces
  - name: account
    description: GDPR / DPDP / COPPA self-export + delete
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: 'Access token issued by POST /auth/login or rotated via POST
        /auth/refresh. Lifetime: 15 minutes (configurable via
        JWT_ACCESS_EXPIRY).'
  schemas:
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Min 12 chars, max 128.
        displayName:
          type: string
          minLength: 1
          maxLength: 60
      required:
        - email
        - password
        - displayName
    AuthSuccessResponseDto:
      type: object
      properties:
        userId:
          type: string
          format: cuid
          description: Authenticated user id.
        accessToken:
          type: string
          description: Bearer access token (JWT). Memory-only — never localStorage.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the access token expires.
      required:
        - userId
        - accessToken
        - expiresAt
    OAuthSignInRequestDto:
      type: object
      properties:
        idToken:
          type: string
          description: Provider-issued ID token (e.g. Google id_token, Apple
            identityToken). Real Google tokens are ~1.2KB; max enforced at 8192.
          minLength: 1
          maxLength: 8192
      required:
        - idToken
    LoginRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        mfaCode:
          type: string
          description: 6-digit TOTP or 8-char backup code (only on the second call when
            MFA is on).
          pattern: ^(\d{6}|[A-Za-z0-9]{8})$
      required:
        - email
        - password
    RefreshSuccessResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: New bearer access token (JWT). Refresh cookie is rotated server-side.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the new access token expires.
      required:
        - accessToken
        - expiresAt
    WhoAmIResponseDto:
      type: object
      properties:
        sub:
          type: string
          format: cuid
          description: User id (`sub` claim).
        sid:
          type: string
          format: cuid
          description: Session id (`sid` claim).
        role:
          type: string
          enum:
            - user
            - premium
            - agent
            - admin
          description: Role assigned to the session.
      required:
        - sub
        - sid
        - role
    CreateTripRequestDto:
      type: object
      properties:
        title:
          type: string
          description: 1..120 chars.
        center:
          type: object
          description: GeoJSON-style { lng, lat } center — same shape the api persists via
            PostGIS.
          additionalProperties: false
          properties:
            lng:
              type: number
              minimum: -180
              maximum: 180
            lat:
              type: number
              minimum: -90
              maximum: 90
          required:
            - lng
            - lat
        radiusKm:
          type: number
          minimum: 1
          maximum: 500
        startsOn:
          type: string
          format: date-time
        endsOn:
          type: string
          format: date-time
      required:
        - title
        - radiusKm
    TripDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid
          description: Owner's user id.
        title:
          type: string
          description: Owner-chosen title (1..120 chars).
        status:
          type: string
          description: Lifecycle status — currently always "draft" until itinerary AI lands.
        radiusKm:
          type: number
          description: Trip planning radius in km (1..500).
          minimum: 1
          maximum: 500
        startsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601; null until the owner picks a date range.
        endsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601; null until the owner picks a date range. >= startsOn when
            both set.
        version:
          type: number
          description: Bumped on every accepted update — concurrency control.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - status
        - radiusKm
        - startsOn
        - endsOn
        - version
        - createdAt
        - updatedAt
    ListTripsResponseDto:
      type: object
      properties:
        trips:
          description: Caller-owned trips, most-recent-first. Capped via ?limit (1..100,
            default 20).
          type: array
          items:
            $ref: '#/components/schemas/TripDto'
      required:
        - trips
    UpdateTripRequestDto:
      type: object
      properties:
        title:
          type: string
          description: 1..120 chars.
        radiusKm:
          type: number
          minimum: 1
          maximum: 500
        startsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601 or null to clear.
        endsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601 or null to clear. >= startsOn when both set.
    ItineraryItemDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        position:
          type: number
          description: Stable position within the day (used for ordering).
        placeId:
          type: object
          nullable: true
          format: cuid
        startTime:
          type: object
          nullable: true
          format: date-time
        endTime:
          type: object
          nullable: true
          format: date-time
        notes:
          type: object
          nullable: true
      required:
        - id
        - position
        - placeId
        - startTime
        - endTime
        - notes
    ItineraryDayDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        tripId:
          type: string
          format: cuid
        dayIndex:
          type: number
