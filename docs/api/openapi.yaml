    SharedTripDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        title:
          type: string
          description: Owner-chosen title.
        radiusKm:
          type: number
          description: Trip planning radius in km.
        startsOn:
          type: object
          nullable: true
          format: date-time
        endsOn:
          type: object
          nullable: true
          format: date-time
        ownerDisplayName:
          type: string
          description: Display name of the owner who shared this trip.
        expiresAt:
          type: object
