info:
  title: TravelSuperApp API
  description: OpenAPI export from the running NestJS app. Per-route schemas land
    progressively as @ApiBody / @ApiResponse decorators get added module by
    module — see docs/api/README.md.
  version: v1
  contact: {}
tags:
  - name: identity
    description: Auth, sessions, profile, MFA
  - name: trip
    description: Trip CRUD, itinerary, sharing, overview composite
  - name: media
    description: Media uploads, memory books
  - name: social
    description: Reviews, votes, expenses, balances
  - name: notifications
    description: Inbox + delivery channels
  - name: admin
    description: Operator-only moderation surfaces
  - name: account
    description: GDPR / DPDP / COPPA self-export + delete
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: 'Access token issued by POST /auth/login or rotated via POST
        /auth/refresh. Lifetime: 15 minutes (configurable via
        JWT_ACCESS_EXPIRY).'
  schemas: {}
