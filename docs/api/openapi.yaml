      required:
        - list
    OverviewListSuccessDto:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/OverviewListDataDto'
      required:
        - ok
        - data
    OverviewLegsDataDto:
      type: object
      properties:
        legs:
          type: array
          items:
            type: object
            additionalProperties: true
