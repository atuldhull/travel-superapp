          description: REVIEW_NOT_FOUND | AGENT_PROFILE_NOT_FOUND.
        "409":
          description: REVIEW_RESPONSE_LOCKED.
        "422":
          description: INVALID_REVIEW_RESPONSE.
      security: *a63
      summary: Agent reply to a review (one-shot). 403 if the review is not about the
        caller; 409 on re-submit.
      tags: *a64
  /api/v1/reviews/{id}/helpful:
    post:
      operationId: ReviewsController_helpful
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Helpful count after the vote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpfulVoteResponseDto"
        "403":
          description: HELPFUL_VOTE_SELF.
        "404":
          description: REVIEW_NOT_FOUND.
      security: *a63
      summary: Mark a review as helpful. Idempotent (re-vote returns the current
        count). Author can't self-vote.
      tags: *a64
  /api/v1/votes/summary:
    get:
      operationId: VotesController_summary
      parameters:
        - name: targetType
          required: true
          in: query
          schema:
            type: string
        - name: targetId
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Vote tally; zero-filled for empty targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteSummaryDto"
        "400":
          description: VALIDATION_FAILED — targetType / targetId missing or invalid.
      summary: Cross-trip vote tally for { targetType, targetId }. @Public —
        crowd-signal aggregation.
      tags:
        - social
  /api/v1/places/{id}/review-summary:
    get:
      operationId: PlaceReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Place review bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceReviewSummaryResponseDto"
      summary: Place detail-page composite — bundles review summary + vote tally +
        recent reviews. @Public.
      tags:
        - social
  /api/v1/stays/{id}/review-summary:
    get:
      operationId: StayReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Stay review bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StayReviewSummaryResponseDto"
      summary: Stay detail-page composite. Same shape as place; votes always zero (no
        vote target for stays).
      tags:
        - social
  /api/v1/eateries/{id}/review-summary:
    get:
      operationId: EateryReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Eatery review bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EateryReviewSummaryResponseDto"
      summary: Eatery detail-page composite. Same shape as place; votes always zero.
      tags:
        - social
  /api/v1/agents/{id}/review-summary:
    get:
      operationId: AgentReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Agent review bundle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentReviewSummaryResponseDto"
