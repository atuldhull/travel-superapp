openapi: 3.0.0
paths:
  /metrics:
    get:
      operationId: MetricsController_scrape
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - Metrics
  /health/live:
    get:
      operationId: HealthController_live
      parameters: []
      responses:
        "200":
          description: ""
      tags: &a4
        - Health
  /health/ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        "200":
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a1
                      database: &a2
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a1
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example: *a1
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a3
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a2
                      redis: *a3
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags: *a4
  /health/startup:
    get:
      operationId: HealthController_startup
      parameters: []
      responses:
        "200":
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a5
                      database: &a6
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a5
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example: *a5
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a7
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a6
                      redis: *a7
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags: *a4
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequestDto"
      responses:
        "201":
          description: Account created; refresh-cookie set; access token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponseDto"
        "409":
          description: EMAIL_TAKEN.
      summary: Create a new account. Email + password + displayName. Sets the
        refresh-cookie + returns access token.
      tags: &a8
        - identity
  /api/v1/auth/oauth/{provider}:
    post:
      operationId: AuthController_oauth
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSignInRequestDto"
      responses:
        "200":
          description: OAuth sign-in succeeded; refresh-cookie set; access token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponseDto"
        "401":
          description: OAUTH_PROVIDER_UNKNOWN / OAUTH_INVALID_TOKEN /
            OAUTH_EMAIL_UNVERIFIED.
      summary: OAuth sign-in. Verifies a provider id token (Google / Apple / mock);
        auto-links by email or creates a passwordless account.
      tags: *a8
  /api/v1/auth/magic-link/request:
    post:
      operationId: AuthController_magicLinkRequest
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkRequestRequestDto"
      responses:
        "200":
          description: Always ok. Email may or may not have been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkRequestResponseDto"
      summary: "Passwordless sign-in step 1: email a magic link. Always returns 'ok' —
        doesn't reveal whether the email is registered."
      tags: *a8
  /api/v1/auth/magic-link/consume:
    post:
      operationId: AuthController_magicLinkConsume
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicLinkConsumeRequestDto"
      responses:
        "200":
          description: Sign-in succeeded; refresh-cookie set; access token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponseDto"
        "401":
          description: MAGIC_LINK_INVALID.
      summary: "Passwordless sign-in step 2: consume the magic-link token + issue a
        session. Single-use, 15-min TTL."
      tags: *a8
  /api/v1/auth/otp/request:
    post:
      operationId: AuthController_otpRequest
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCodeRequestRequestDto"
      responses:
        "200":
          description: Always ok. Code may or may not have been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MagicLinkRequestResponseDto"
      summary: "Passwordless OTP step 1: email/SMS a 6-digit code. Always 'ok' — never
        reveals registration."
      tags: *a8
  /api/v1/auth/otp/verify:
    post:
      operationId: AuthController_otpVerify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCodeVerifyRequestDto"
      responses:
        "200":
          description: Sign-in succeeded; refresh-cookie set; access token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponseDto"
        "401":
          description: LOGIN_CODE_INVALID.
      summary: "Passwordless OTP step 2: verify the code + issue a session."
      tags: *a8
  /api/v1/auth/password-reset/request:
    post:
      operationId: AuthController_passwordResetRequest
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequestDto"
      responses:
        "200":
          description: Always ok. Email may or may not have been sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResponseDto"
      summary: V.UX.31 — request a password-reset email. Always returns ok regardless
        of registration state.
      tags: *a8
  /api/v1/auth/password-reset/consume:
    post:
      operationId: AuthController_passwordResetConsume
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConsumeRequestDto"
      responses:
        "200":
          description: Password updated. User must sign in with the new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConsumeResponseDto"
        "401":
          description: RESET_TOKEN_INVALID.
        "422":
          description: WEAK_PASSWORD or VALIDATION_FAILED.
      summary: V.UX.31 — consume the password-reset token + set a new password.
        Single-use, 15-min TTL.
      tags: *a8
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequestDto"
      responses:
        "200":
          description: Login succeeded; refresh-cookie set; access token returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSuccessResponseDto"
        "401":
          description: INVALID_CREDENTIALS / MFA_REQUIRED / MFA_INVALID.
      summary: Email + password login. With MFA enabled, mfaCode is required on the
        second call.
      tags: *a8
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      responses:
        "200":
          description: New access token issued; new refresh cookie set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshSuccessResponseDto"
        "401":
          description: REFRESH_MISSING / REFRESH_INVALID / REFRESH_REUSED.
      summary: Rotate the access + refresh tokens. Reads the httpOnly refresh cookie;
        rejects if missing or stolen-detected.
      tags: *a8
  /api/v1/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        "200":
          description: Caller JWT claims (sub / sid / role) + hasSeenOnboarding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhoAmIResponseDto"
        "401":
          description: UNAUTHENTICATED — missing or invalid bearer.
      security:
        - bearer: []
      summary: Whoami probe — returns the authed user's JWT claims + lightweight
        User-row state (hasSeenOnboarding).
      tags: *a8
  /api/v1/auth/onboarding/complete:
    post:
      operationId: AuthController_onboardingComplete
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingCompleteRequestDto"
      responses:
        "200":
          description: Onboarding flag flipped (and Sample trip seeded if requested +
            applicable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingCompleteResponseDto"
        "401":
          description: UNAUTHENTICATED.
      security:
        - bearer: []
      summary: Mark the caller as having completed the onboarding wizard; optionally
        seed a Sample trip. Idempotent.
      tags: *a8
  /api/v1/auth/mfa/setup:
    post:
      operationId: AuthController_mfaSetup
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - bearer: []
      summary: Begin MFA enrollment — returns base32 secret + otpauth:// URI for QR
        rendering. Pending until /mfa/verify confirms.
      tags: *a8
  /api/v1/auth/mfa/verify:
    post:
      operationId: AuthController_mfaVerify
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - bearer: []
      summary: Confirm MFA enrollment with a TOTP code. First-time enable returns 10
        plaintext backup codes (shown ONCE).
      tags: *a8
  /api/v1/auth/mfa/backup-codes/regenerate:
    post:
      operationId: AuthController_regenerateBackupCodes
      parameters: []
      responses:
        "200":
          description: ""
      security:
        - bearer: []
      summary: Regenerate the 10 single-use MFA backup codes. Requires a valid current
        TOTP. Returns plaintexts shown ONCE.
      tags: *a8
  /api/v1/auth/mfa/disable:
    post:
      operationId: AuthController_mfaDisable
      parameters: []
      responses:
        "204":
          description: ""
      security:
        - bearer: []
      summary: Disable MFA. Requires a valid TOTP — a hijacked session alone cannot
        strip the second factor.
      tags: *a8
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        "204":
          description: ""
      summary: Logout — revokes the refresh token + clears the cookie. Idempotent if
        already logged out.
      tags: *a8
  /api/v1/admin/identity/jwks/rotate:
    post:
      operationId: JwksAdminController_rotate
      parameters: []
      responses:
        "200":
          description: New kid + previous kids.
        "403":
          description: Caller is not admin.
      security: &a9
        - bearer: []
      summary: Rotate a JWT signing keyring (access | refresh). Returns new kid +
        previous-kid retirement list.
      tags: &a10
        - admin
  /api/v1/admin/identity/jwks/kids:
    get:
      operationId: JwksAdminController_kids
      parameters: []
      responses:
        "200":
          description: ""
      security: *a9
      summary: List active kids across both keyrings (access + refresh). Used to
        confirm rotations + retirement windows.
      tags: *a10
  /api/v1/trips:
    post:
      operationId: TripController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripRequestDto"
      responses:
        "201":
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
      security: &a11
        - bearer: []
      summary: Create a trip draft from { title, center, radiusKm, startsOn?, endsOn? }
      tags: &a12
        - trip
    get:
      operationId: TripController_list
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: archived
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Caller-owned trips, most-recent-first. ?limit=N (1..100, default 20).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTripsResponseDto"
      security: *a11
      summary: List the caller's trips, most-recent-first
      tags: *a12
  /api/v1/trips/suggestions:
    get:
      operationId: TripController_suggestions
      parameters: []
      responses:
        "200":
          description: Up to 3 suggestions.
      security: *a11
      summary: V.UX.30 — destination suggestions seeded from caller's past trips.
        Empty history → 3 globally popular picks.
      tags: *a12
  /api/v1/trips/{id}/archive:
    post:
      operationId: TripController_archive
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: cuid
            type: string
      responses:
        "200":
          description: Archived trip row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: V.UX.30 — archive a trip (soft). Idempotent. Owner-gated; 404 on
        cross-user.
      tags: *a12
  /api/v1/trips/{id}/unarchive:
    post:
      operationId: TripController_unarchive
      parameters:
        - name: id
          required: true
          in: path
          schema:
            format: cuid
            type: string
      responses:
        "200":
          description: Unarchived trip row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: V.UX.30 — unarchive a trip. Idempotent. Owner-gated; 404 on cross-user.
      tags: *a12
  /api/v1/trips/{id}:
    get:
      operationId: TripController_getOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: The trip + caller role.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripWithRoleResponseDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Fetch a single trip. Owner OR active collaborator (vote/expense). 404
        otherwise (IDOR-safe).
      tags: *a12
    patch:
      operationId: TripController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTripRequestDto"
      responses:
        "200":
          description: Updated trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Update a trip the caller owns. Partial body; only provided fields change.
      tags: *a12
    delete:
      operationId: TripController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: Trip deleted.
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Delete a trip the caller owns. Cascades to itinerary days, items, shares.
      tags: *a12
  /api/v1/trips/{id}/duplicate:
    post:
      operationId: TripController_duplicate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: Newly-created duplicate trip.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Duplicate a trip the caller owns. Deep-copies title (+" (copy)"),
        center, radius, dates, itinerary days/items. New trip is `draft`.
      tags: *a12
  /api/v1/trips/{id}/lock:
    post:
      operationId: TripController_lock
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Trip after lock (status="published").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Lock the trip — freezes itinerary edits for share-collaborators;
        owner-only writes still work.
      tags: *a12
  /api/v1/trips/{id}/unlock:
    post:
      operationId: TripController_unlock
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Trip after unlock (status="draft").
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Unlock the trip — restores share-collaborator edit access.
      tags: *a12
  /api/v1/trips/{id}/itinerary:
    post:
      operationId: TripController_buildItinerary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Newly-generated itinerary days (replaces any prior ones).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryListResponseDto"
        "422":
          description: TRIP_DATES_REQUIRED.
      security: *a11
      summary: Generate itinerary stub for the trip (one ItineraryDay per date in the
        range).
      tags: *a12
    get:
      operationId: TripController_getItinerary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Itinerary days, ordered by dayIndex.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryListResponseDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: List itinerary days + items for the trip the caller owns.
      tags: *a12
  /api/v1/trips/sample-plan:
    post:
      operationId: TripController_samplePlan
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSamplePlanRequestDto"
      responses:
        "200":
          description: Free-form prose plan + provider model identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSamplePlanResponseDto"
      security: *a11
      summary: Public sample-plan demo for the landing page. NO auth, NO trip
        persisted — feeds the AI port directly.
      tags: *a12
  /api/v1/trips/{id}/plan-with-ai:
    post:
      operationId: TripController_planWithAi
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Free-form prose plan + provider identifier + optional token usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratePlanWithAiResponseDto"
        "404":
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Generate a free-form trip plan via the configured AI adapter (Anthropic
        / Gemini / Ollama / stub — see [POST.4]). Owner-only.
      tags: *a12
  /api/v1/trips/{id}/share:
    post:
      operationId: TripController_share
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripShareRequestDto"
      responses:
        "201":
          description: Newly-minted share. Use `shareCode` in the public
            /trips/shared/:code path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripShareResponseDto"
        "404":
          description: TRIP_NOT_FOUND.
        "422":
          description: INVALID_EXPIRY (past timestamp).
      security: *a11
      summary: Mint a share code so collaborators can view (or co-edit, if
        publicRead=false) the trip.
      tags: *a12
  /api/v1/trips/shared/{code}:
    get:
      operationId: TripController_getSharedTrip
      parameters:
        - name: code
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: Public-safe trip view + itinerary. Owner userId is never exposed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedTripDto"
        "404":
          description: Share code not found, revoked, or expired.
      security: *a11
      summary: Public read of a shared trip by code. No auth required.
      tags: *a12
  /api/v1/trips/shared/{code}/clone:
    post:
      operationId: TripController_cloneShared
      parameters:
        - name: code
          required: true
          in: path
          schema:
            type: string
      responses:
        "201":
          description: New draft trip cloned from the source share-code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDto"
        "404":
          description: SHARE_NOT_FOUND or SHARE_EXPIRED.
      security: *a11
      summary: Clone a publicly-shared trip into the caller's account. Auth required.
      tags: *a12
  /api/v1/trips/{id}/overview:
    get:
