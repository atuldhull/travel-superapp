openapi: 3.0.0
paths:
  /metrics:
    get:
      operationId: MetricsController_scrape
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Metrics
  /health/live:
    get:
      operationId: HealthController_live
      parameters: []
      responses:
        '200':
          description: ''
      tags: &a4
        - Health
  /health/ready:
    get:
      operationId: HealthController_ready
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a1
                      database: &a2
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a1
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example: *a1
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a3
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a2
                      redis: *a3
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags: *a4
  /health/startup:
    get:
      operationId: HealthController_startup
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a5
                      database: &a6
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a5
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example: *a5
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a7
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a6
                      redis: *a7
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags: *a4
  /api/v1/auth/register:
    post:
      operationId: AuthController_register
      parameters: []
      responses:
        '201':
          description: AuthSuccessBody { userId, accessToken, expiresAt }.
        '409':
          description: EMAIL_TAKEN.
      summary: Create a new account. Email + password + displayName. Sets the
        refresh-cookie + returns access token.
      tags: &a8
        - identity
  /api/v1/auth/oauth/{provider}:
    post:
      operationId: AuthController_oauth
      parameters:
        - name: provider
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: AuthSuccessBody.
        '401':
          description: OAUTH_PROVIDER_UNKNOWN / OAUTH_INVALID_TOKEN /
            OAUTH_EMAIL_UNVERIFIED.
      summary: OAuth sign-in. Verifies a provider id token (Google / Apple / mock);
        auto-links by email or creates a passwordless account.
      tags: *a8
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      responses:
        '200':
          description: AuthSuccessBody.
        '401':
          description: INVALID_CREDENTIALS / MFA_REQUIRED / MFA_INVALID.
      summary: Email + password login. With MFA enabled, mfaCode is required on the
        second call.
      tags: *a8
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      responses:
        '200':
          description: New { accessToken, expiresAt }. New refresh cookie set.
        '401':
          description: REFRESH_MISSING / REFRESH_INVALID / REFRESH_REUSED.
      summary: Rotate the access + refresh tokens. Reads the httpOnly refresh cookie;
        rejects if missing or stolen-detected.
      tags: *a8
  /api/v1/auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Whoami probe — returns the authed user's JWT claims. The reference
        auth-gated endpoint pattern.
      tags: *a8
  /api/v1/auth/mfa/setup:
    post:
      operationId: AuthController_mfaSetup
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Begin MFA enrollment — returns base32 secret + otpauth:// URI for QR
        rendering. Pending until /mfa/verify confirms.
      tags: *a8
  /api/v1/auth/mfa/verify:
    post:
      operationId: AuthController_mfaVerify
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Confirm MFA enrollment with a TOTP code. First-time enable returns 10
        plaintext backup codes (shown ONCE).
      tags: *a8
  /api/v1/auth/mfa/backup-codes/regenerate:
    post:
      operationId: AuthController_regenerateBackupCodes
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Regenerate the 10 single-use MFA backup codes. Requires a valid current
        TOTP. Returns plaintexts shown ONCE.
      tags: *a8
  /api/v1/auth/mfa/disable:
    post:
      operationId: AuthController_mfaDisable
      parameters: []
      responses:
        '204':
          description: ''
      security:
        - bearer: []
      summary: Disable MFA. Requires a valid TOTP — a hijacked session alone cannot
        strip the second factor.
      tags: *a8
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      responses:
        '204':
          description: ''
      summary: Logout — revokes the refresh token + clears the cookie. Idempotent if
        already logged out.
      tags: *a8
  /api/v1/admin/identity/jwks/rotate:
    post:
      operationId: JwksAdminController_rotate
      parameters: []
      responses:
        '200':
          description: New kid + previous kids.
        '403':
          description: Caller is not admin.
      security: &a9
        - bearer: []
      summary: Rotate a JWT signing keyring (access | refresh). Returns new kid +
        previous-kid retirement list.
      tags: &a10
        - admin
  /api/v1/admin/identity/jwks/kids:
    get:
      operationId: JwksAdminController_kids
      parameters: []
      responses:
        '200':
          description: ''
      security: *a9
      summary: List active kids across both keyrings (access + refresh). Used to
        confirm rotations + retirement windows.
      tags: *a10
  /api/v1/trips:
    post:
      operationId: TripController_create
      parameters: []
      responses:
        '201':
          description: Trip created.
      security: &a11
        - bearer: []
      summary: Create a trip draft from { title, center, radiusKm, startsOn?, endsOn? }
      tags: &a12
        - trip
    get:
      operationId: TripController_list
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of trips.
      security: *a11
      summary: List the caller's trips, most-recent-first
      tags: *a12
  /api/v1/trips/{id}:
    get:
      operationId: TripController_getOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: The trip.
        '404':
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Fetch a single trip the caller owns. 404 if missing or not theirs
        (IDOR-safe).
      tags: *a12
    patch:
      operationId: TripController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated trip.
        '404':
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Update a trip the caller owns. Partial body; only provided fields change.
      tags: *a12
    delete:
      operationId: TripController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Trip deleted.
        '404':
          description: TRIP_NOT_FOUND.
      security: *a11
      summary: Delete a trip the caller owns. Cascades to itinerary days, items, shares.
      tags: *a12
  /api/v1/trips/{id}/itinerary:
    post:
      operationId: TripController_buildItinerary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Generate itinerary stub for the trip (one ItineraryDay per date in the
        range).
      tags: *a12
    get:
      operationId: TripController_getItinerary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: List itinerary days + items for the trip the caller owns.
      tags: *a12
  /api/v1/trips/{id}/share:
    post:
      operationId: TripController_share
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
      security: *a11
      summary: Mint a share code so collaborators can view (or co-edit, if
        publicRead=false) the trip.
      tags: *a12
  /api/v1/trips/shared/{code}:
    get:
      operationId: TripController_getSharedTrip
      parameters:
        - name: code
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Public read of a shared trip by code. No auth required.
      tags: *a12
  /api/v1/trips/{id}/overview:
    get:
      operationId: TripController_overview
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Per-user-cached composite. Empty/dateless sections surface as {
            ok:false, code }.
      security: *a11
      summary: Trip overview composite — 7 sections (itinerary, weather, stays,
        eateries, events, transport, media). Per-section graceful degradation.
        60s TTL cache.
      tags: *a12
  /api/v1/trips/{id}/eateries:
    get:
      operationId: TripController_eateries
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: cuisineTag
          required: true
          in: query
          schema:
            type: string
        - name: maxPriceTier
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Eateries near the trip center. Optional cuisineTag + maxPriceTier
        filters.
      tags: *a12
  /api/v1/trips/{id}/events:
    get:
      operationId: TripController_events
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: category
          required: true
          in: query
          schema:
            type: string
      responses:
        '422':
          description: TRIP_DATES_REQUIRED.
      security: *a11
      summary: Events near the trip center during the trip date range. Requires
        startsOn + endsOn.
      tags: *a12
  /api/v1/trips/{id}/stays:
    get:
      operationId: TripController_stays
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: guests
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Stays near the trip center for the trip date range. Requires startsOn +
        endsOn.
      tags: *a12
  /api/v1/trips/{id}/weather:
    get:
      operationId: TripController_weather
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Weather forecast for the trip center. Up to 16 days. TTL-cached.
      tags: *a12
  /api/v1/trips/{id}/shares:
    get:
      operationId: TripController_listShares
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: List active share codes for the trip the caller owns.
      tags: *a12
  /api/v1/trips/{id}/share/{code}:
    delete:
      operationId: TripController_revokeShare
      parameters:
        - name: code
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      security: *a11
      summary: Revoke a share code. Owner-scoped.
      tags: *a12
  /api/v1/trips/{id}/transport-legs:
    get:
      operationId: TripController_transportLegs
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Compute transport legs between consecutive itinerary items.
      tags: *a12
  /api/v1/trips/{tripId}/itinerary/{dayId}:
    patch:
      operationId: TripController_updateDay
      parameters:
        - name: tripId
          required: true
          in: path
          schema:
            type: string
        - name: dayId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security: *a11
      summary: Replace items in an itinerary day. Owner OR active TripShare may write.
      tags: *a12
  /api/v1/admin/trips:
    get:
      operationId: AdminTripsController_list
      parameters:
        - name: q
          required: true
          in: query
          schema:
            type: string
        - name: status
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: offset
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated trip rows.
        '403':
          description: Caller is not admin.
      security: &a13
        - bearer: []
      summary: List trips across all users with optional q + status filters. Admin-only.
      tags: &a14
        - admin
  /api/v1/admin/trips/{id}/archive:
    post:
      operationId: AdminTripsController_archive
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Trip archived.
      security: *a13
      summary: Soft-archive a trip (status = archived). Reversible by the owner via
        the standard CRUD path.
      tags: *a14
  /api/v1/admin/trips/{id}:
    delete:
      operationId: AdminTripsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Trip deleted.
      security: *a13
      summary: Hard-delete a trip + cascade itinerary. For takedowns of
        clearly-abusive content.
      tags: *a14
  /api/v1/places/search:
    post:
      operationId: PlacesController_search
      parameters: []
      responses:
        '200':
          description: ''
      tags: &a15
        - Places
  /api/v1/places/federated-search:
    post:
      operationId: PlacesController_federated
      parameters: []
      responses:
        '200':
          description: ''
      tags: *a15
  /api/v1/weather/forecast:
    get:
      operationId: WeatherController_forecast
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Weather
  /api/v1/stays/search:
    post:
      operationId: StaysController_search
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Stays
  /api/v1/eateries/search:
    post:
      operationId: FoodController_search
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Food
  /api/v1/events/search:
    post:
      operationId: EventsController_search
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Events
  /api/v1/transport/routes:
    post:
      operationId: TransportController_routes
      parameters: []
      responses:
        '200':
          description: ''
      tags:
        - Transport
  /api/v1/media/upload-url:
    post:
      operationId: MediaController_createUploadUrl
      parameters: []
      responses:
        '201':
          description: ''
      tags: &a16
        - Media
  /api/v1/media/{id}/confirm:
    post:
      operationId: MediaController_confirm
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a16
  /api/v1/media/{id}/download-url:
    get:
      operationId: MediaController_downloadUrl
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a16
  /api/v1/media/{id}/trip:
    patch:
      operationId: MediaController_attachToTrip
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a16
  /api/v1/media/trip/{tripId}:
    get:
      operationId: MediaController_listByTrip
      parameters:
        - name: tripId
          required: true
          in: path
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a16
  /api/v1/media/{id}/memory-book:
    patch:
      operationId: MediaController_attachToBook
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a16
  /api/v1/memory-books/featured:
    get:
      operationId: MemoryBookController_featured
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: &a17
        - MemoryBook
  /api/v1/memory-books/public/{id}:
    get:
      operationId: MemoryBookController_getPublic
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
  /api/v1/memory-books/public/{id}/assets/{assetId}/download-url:
    get:
      operationId: MemoryBookController_getPublicAssetDownloadUrl
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: assetId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
  /api/v1/memory-books:
    post:
      operationId: MemoryBookController_create
      parameters: []
      responses:
        '201':
          description: ''
      tags: *a17
    get:
      operationId: MemoryBookController_list
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
  /api/v1/memory-books/{id}:
    get:
      operationId: MemoryBookController_getOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
    patch:
      operationId: MemoryBookController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
    delete:
      operationId: MemoryBookController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      tags: *a17
  /api/v1/memory-books/{id}/publish:
    post:
      operationId: MemoryBookController_publish
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
  /api/v1/memory-books/{id}/unpublish:
    post:
      operationId: MemoryBookController_unpublish
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *a17
  /api/v1/admin/media:
    get:
      operationId: AdminMediaController_list
      parameters:
        - name: ownerId
          required: true
          in: query
          schema:
            type: string
        - name: kind
          required: true
          in: query
          schema:
            type: string
        - name: status
          required: true
          in: query
          schema:
            type: string
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: offset
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: &a18
        - AdminMedia
  /api/v1/admin/media/{id}:
    delete:
      operationId: AdminMediaController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: ''
      tags: *a18
  /api/v1/notifications/me/unread-count:
    get:
      operationId: NotificationsController_unreadCount
      parameters: []
      responses:
        '200':
          description: ''
      tags: &a19
        - Notifications
  /api/v1/notifications/me:
    get:
      operationId: NotificationsController_listMine
      parameters:
        - name: limit
          required: true
