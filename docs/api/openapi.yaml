      required:
        - ok
        - data
    OverviewTripMetaDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid
        title:
          type: string
        status:
          type: string
        radiusKm:
          type: number
          minimum: 1
          maximum: 500
        startsOn:
          type: object
          nullable: true
          format: date-time
        endsOn:
          type: object
          nullable: true
          format: date-time
        version:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
