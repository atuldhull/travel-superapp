              schema:
                $ref: '#/components/schemas/PlaceReviewSummaryResponseDto'
      summary: Place detail-page composite — bundles review summary + vote tally +
        recent reviews. @Public.
      tags:
        - social
  /api/v1/stays/{id}/review-summary:
    get:
      operationId: StayReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Stay review bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StayReviewSummaryResponseDto'
      summary: Stay detail-page composite. Same shape as place; votes always zero (no
        vote target for stays).
      tags:
        - social
  /api/v1/eateries/{id}/review-summary:
    get:
      operationId: EateryReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Eatery review bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EateryReviewSummaryResponseDto'
      summary: Eatery detail-page composite. Same shape as place; votes always zero.
      tags:
        - social
  /api/v1/agents/{id}/review-summary:
    get:
      operationId: AgentReviewSummaryController_summary
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Agent review bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReviewSummaryResponseDto'
      summary: Agent detail-page composite. Closes the 4-of-4 review-target arc; votes
        always zero.
      tags:
        - social
  /api/v1/trips/shared/{code}/heart:
    post:
      operationId: SharedTripReactController_heartTrip
      parameters:
        - name: code
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Updated heart count for the trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartSharedTripResponseDto'
        '404':
          description: SHARE_NOT_FOUND or SHARE_EXPIRED.
        '429':
          description: Too many requests — wait 60s.
      summary: ❤️ a publicly-shared trip. No auth. Per-IP rate-limited at 1/min so
        anonymous fans can react but scripts can't farm hearts.
      tags: &a49
        - social
  /api/v1/trips/shared/{code}/hearts:
    get:
      operationId: SharedTripReactController_getHearts
      parameters:
        - name: code
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Heart count snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedTripHeartCountResponseDto'
        '404':
          description: SHARE_NOT_FOUND or SHARE_EXPIRED.
      summary: Current ❤️ count for a shared trip. Public, no auth.
      tags: *a49
  /api/v1/feed/me:
    get:
      operationId: FeedController_me
      parameters:
        - name: limit
          required: true
          in: query
          schema:
            type: string
        - name: before
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Activity items + nextBefore cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResponseDto'
        '400':
          description: VALIDATION_FAILED — before is not an ISO timestamp, or limit is
            non-positive.
      security:
        - bearer: []
      summary: List the caller's recent activity (cursor pagination via ?before=).
        Optional ?limit caps the page size.
      tags:
        - feed
info:
  title: TravelSuperApp API
  description: OpenAPI export from the running NestJS app. Per-route schemas land
    progressively as @ApiBody / @ApiResponse decorators get added module by
    module — see docs/api/README.md.
  version: v1
  contact: {}
tags:
  - name: identity
    description: Auth, sessions, profile, MFA
  - name: trip
    description: Trip CRUD, itinerary, sharing, overview composite
  - name: media
    description: Media uploads, memory books
  - name: social
    description: Reviews, votes, expenses, balances
  - name: notifications
    description: Inbox + delivery channels
  - name: admin
    description: Operator-only moderation surfaces
  - name: account
    description: GDPR / DPDP / COPPA self-export + delete
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: 'Access token issued by POST /auth/login or rotated via POST
        /auth/refresh. Lifetime: 15 minutes (configurable via
        JWT_ACCESS_EXPIRY).'
  schemas:
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Min 12 chars, max 128.
        displayName:
          type: string
          minLength: 1
          maxLength: 60
      required:
        - email
        - password
        - displayName
    AuthSuccessResponseDto:
      type: object
      properties:
        userId:
          type: string
          format: cuid
          description: Authenticated user id.
        accessToken:
          type: string
          description: Bearer access token (JWT). Memory-only — never localStorage.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the access token expires.
      required:
        - userId
        - accessToken
        - expiresAt
    OAuthSignInRequestDto:
      type: object
      properties:
        idToken:
          type: string
          description: Provider-issued ID token (e.g. Google id_token, Apple
            identityToken). Real Google tokens are ~1.2KB; max enforced at 8192.
          minLength: 1
          maxLength: 8192
      required:
        - idToken
    MagicLinkRequestRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
        - email
    MagicLinkRequestResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          description: Always 'ok'. Doesn't reveal whether the email is registered.
      required:
        - status
    MagicLinkConsumeRequestDto:
      type: object
      properties:
        token:
          type: string
          description: 64 lower-case hex characters (32 random bytes) from the email link
            URL.
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
      required:
        - token
    LoginRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        mfaCode:
          type: string
          description: 6-digit TOTP or 8-char backup code (only on the second call when
            MFA is on).
          pattern: ^(\d{6}|[A-Za-z0-9]{8})$
      required:
        - email
        - password
    RefreshSuccessResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: New bearer access token (JWT). Refresh cookie is rotated server-side.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the new access token expires.
      required:
        - accessToken
        - expiresAt
    WhoAmIResponseDto:
      type: object
      properties:
        sub:
          type: string
          format: cuid
          description: User id (`sub` claim).
        sid:
          type: string
          format: cuid
          description: Session id (`sid` claim).
        role:
          type: string
          enum:
            - user
            - premium
            - agent
            - admin
          description: Role assigned to the session.
        hasSeenOnboarding:
          type: boolean
          description: True iff the user has completed (or skipped) the 3-step onboarding
            wizard. Web client uses this to decide whether to bounce post-login
            → /onboarding or → /trips. Installed by [V.UX.3].
      required:
        - sub
        - sid
        - role
        - hasSeenOnboarding
    OnboardingCompleteRequestDto:
      type: object
      properties:
        seedSample:
          type: boolean
          description: When true, also seed a read-only "Sample trip — Goa weekend" if the
            user has zero trips. Sent from the Skip terminal of the onboarding
            wizard. Idempotent.
    OnboardingCompleteResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    CreateTripRequestDto:
      type: object
      properties:
        title:
          type: string
          description: 1..120 chars.
        center:
          type: object
          description: GeoJSON-style { lng, lat } center — same shape the api persists via
            PostGIS.
          additionalProperties: false
          properties:
            lng:
              type: number
              minimum: -180
              maximum: 180
            lat:
              type: number
              minimum: -90
              maximum: 90
          required:
            - lng
            - lat
        radiusKm:
          type: number
          minimum: 1
          maximum: 500
        startsOn:
          type: string
          format: date-time
        endsOn:
          type: string
          format: date-time
      required:
        - title
        - radiusKm
    TripDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        userId:
          type: string
          format: cuid
          description: Owner's user id.
        title:
          type: string
          description: Owner-chosen title (1..120 chars).
        status:
          type: string
          description: Lifecycle status — currently always "draft" until itinerary AI lands.
        radiusKm:
          type: number
          description: Trip planning radius in km (1..500).
          minimum: 1
          maximum: 500
        startsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601; null until the owner picks a date range.
        endsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601; null until the owner picks a date range. >= startsOn when
            both set.
        version:
          type: number
          description: Bumped on every accepted update — concurrency control.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - status
        - radiusKm
        - startsOn
        - endsOn
        - version
        - createdAt
        - updatedAt
    ListTripsResponseDto:
      type: object
      properties:
        trips:
          description: Caller-owned trips, most-recent-first. Capped via ?limit (1..100,
            default 20).
          type: array
          items:
            $ref: '#/components/schemas/TripDto'
        collaborated:
          description: V.UX.9 — trips someone else owns but the caller participates in via
            a vote or expense.
          type: array
          items:
            $ref: '#/components/schemas/TripDto'
      required:
        - trips
        - collaborated
    TripWithRoleResponseDto:
      type: object
      properties:
        trip:
          $ref: '#/components/schemas/TripDto'
        role:
          type: string
          description: '"owner" or "collaborator".'
        ownerDisplayName:
          type: object
          nullable: true
          description: Display name of the trip's owner — surfaced for collaborator banners.
      required:
        - trip
        - role
        - ownerDisplayName
    UpdateTripRequestDto:
      type: object
      properties:
        title:
          type: string
          description: 1..120 chars.
        radiusKm:
          type: number
          minimum: 1
          maximum: 500
        startsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601 or null to clear.
        endsOn:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601 or null to clear. >= startsOn when both set.
    ItineraryItemDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        position:
          type: number
          description: Stable position within the day (used for ordering).
        placeId:
          type: object
          nullable: true
          format: cuid
        startTime:
          type: object
          nullable: true
          format: date-time
        endTime:
          type: object
          nullable: true
          format: date-time
        notes:
          type: object
          nullable: true
      required:
        - id
        - position
        - placeId
        - startTime
        - endTime
        - notes
    ItineraryDayDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        tripId:
          type: string
          format: cuid
        dayIndex:
          type: number
          description: Zero-based index from the trip start date.
        date:
          type: string
          format: date-time
        summary:
          type: object
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryItemDto'
      required:
        - id
        - tripId
        - dayIndex
        - date
        - summary
        - items
    ItineraryListResponseDto:
      type: object
      properties:
        days:
          description: Itinerary days, ordered by dayIndex ascending.
          type: array
          items:
            $ref: '#/components/schemas/ItineraryDayDto'
      required:
        - days
    SamplePlanCenterDto:
      type: object
      properties:
        lat:
          type: number
          description: Latitude in decimal degrees, -90..90.
        lng:
          type: number
          description: Longitude in decimal degrees, -180..180.
      required:
        - lat
        - lng
    GenerateSamplePlanRequestDto:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Sample destination title (e.g. "Goa", "Tokyo").
        center:
          $ref: '#/components/schemas/SamplePlanCenterDto'
        radiusKm:
          type: number
          minimum: 1
          maximum: 200
          description: Search radius in km.
      required:
        - title
        - center
        - radiusKm
    GenerateSamplePlanResponseDto:
      type: object
      properties:
        plan:
          type: string
          description: Free-form prose plan from the AI provider.
        model:
          type: string
          description: Model identifier (e.g. "claude-sonnet-4-6" or "stub-trip-planner"
            when CLAUDE_API_KEY is unset).
      required:
        - plan
        - model
    GeneratePlanWithAiResponseDto:
      type: object
      properties:
        plan:
          type: string
          description: Free-form prose plan from the AI provider.
        model:
          type: string
          description: Model identifier (e.g. "claude-sonnet-4-6" or "stub-trip-planner"
            when CLAUDE_API_KEY is unset).
      required:
        - plan
        - model
    CreateTripShareRequestDto:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry. Omit for a non-expiring share code.
    TripShareResponseDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        tripId:
          type: string
          format: cuid
        shareCode:
          type: string
          description: Opaque token; recipients hit `GET /trips/shared/:code` to view the
            trip.
        expiresAt:
          type: object
          nullable: true
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - tripId
        - shareCode
        - expiresAt
        - createdAt
    SharedTripDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        title:
          type: string
          description: Owner-chosen title.
        radiusKm:
          type: number
          description: Trip planning radius in km.
        startsOn:
          type: object
          nullable: true
          format: date-time
        endsOn:
          type: object
          nullable: true
          format: date-time
        ownerDisplayName:
          type: string
          description: Display name of the owner who shared this trip.
        expiresAt:
          type: object
          nullable: true
          format: date-time
          description: ISO-8601 expiry for the share code itself, not the trip.
        createdAt:
          type: string
          format: date-time
        days:
          description: Itinerary days + items, ordered by dayIndex ascending.
          type: array
          items:
            $ref: '#/components/schemas/ItineraryDayDto'
      required:
        - id
        - title
        - radiusKm
        - startsOn
        - endsOn
        - ownerDisplayName
        - expiresAt
        - createdAt
        - days
    OverviewSectionFailureDto:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - false
          description: 'Discriminator: this section failed.'
        code:
          type: string
          description: Stable failure code (e.g. TRIP_DATES_REQUIRED, PROVIDER_UNREACHABLE).
      required:
        - ok
        - code
    OverviewItineraryDayDto:
      type: object
      properties:
        id:
          type: string
          format: cuid
        tripId:
          type: string
          format: cuid
        dayIndex:
          type: number
        date:
          type: string
          format: date-time
        summary:
          type: object
          nullable: true
        items:
          type: array
          items:
            type: object
            additionalProperties: true
      required:
        - id
        - tripId
        - dayIndex
        - date
        - summary
        - items
    OverviewItineraryDataDto:
      type: object
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/OverviewItineraryDayDto'
      required:
        - days
    OverviewItinerarySuccessDto:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/OverviewItineraryDataDto'
      required:
        - ok
        - data
    OverviewWeatherDataDto:
      type: object
      properties:
        forecast:
          type: object
          additionalProperties: true
          description: WeatherForecast — daily array + provider metadata. See /weather
            endpoints.
      required:
        - forecast
    OverviewWeatherSuccessDto:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        data:
          $ref: '#/components/schemas/OverviewWeatherDataDto'
      required:
        - ok
        - data
    OverviewListDataDto:
      type: object
      properties:
        list:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Provider-shaped listings (StayListing / EateryListing /
