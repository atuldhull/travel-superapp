      required:
        - email
    PasswordResetRequestResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          description: Always 'ok'. Doesn't reveal whether the email is registered.
          example: ok
      required:
        - status
    PasswordResetConsumeRequestDto:
      type: object
      properties:
        token:
          type: string
          description: 64 lower-case hex characters (32 random bytes) from the email link
            URL.
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
          example: b27e1a5cc4e8f9d2a1b6c3d8e9f4a7b2c5d8e1f4a7b0c3d6e9f2a5b8c1d4e7f0
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: New password (12..128 chars).
          example: a-brand-new-passphrase-2026
      required:
        - token
        - newPassword
    PasswordResetConsumeResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          example: ok
      required:
        - status
    LoginRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: rashmi@example.com
        password:
          type: string
          minLength: 1
          maxLength: 128
          example: correct-horse-battery-staple
        mfaCode:
          type: string
          description: 6-digit TOTP or 8-char backup code (only on the second call when
            MFA is on).
          pattern: ^(\d{6}|[A-Za-z0-9]{8})$
          example: "482915"
      required:
        - email
        - password
    RefreshSuccessResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: New bearer access token (JWT). Refresh cookie is rotated server-side.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjFhYjJjM2Q0In0.eyJzdWIiOiJjbHhuOHEzdDQwMDAwIn0.signature…
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the new access token expires.
          example: 2026-05-26T10:50:00.000Z
      required:
        - accessToken
        - expiresAt
    WhoAmIResponseDto:
      type: object
      properties:
        sub:
          type: string
          format: cuid
          description: User id (`sub` claim).
          example: clxn8q3t40000jq08yzn4l1ab
        sid:
          type: string
          format: cuid
          description: Session id (`sid` claim).
          example: clxn8q9f80001jq08kk72g3dx
        role:
          type: string
          enum:
            - user
            - premium
            - agent
            - admin
            - compliance
            - sre
          description: Role assigned to the session.
          example: user
        hasSeenOnboarding:
          type: boolean
          description: True iff the user has completed (or skipped) the 3-step onboarding
            wizard. Web client uses this to decide whether to bounce post-login
            → /onboarding or → /trips. Installed by [V.UX.3].
          example: true
        previousSeenAt:
          type: object
          nullable: true
          format: date-time
          description: V.UX.30 — the visit BEFORE the current one. Web compares this
            against now() to decide whether to render the welcome-back hero
            (>30d gap fires it). Null on first sign-in.
          example: 2026-04-12T18:22:30.000Z
      required:
        - sub
        - sid
        - role
        - hasSeenOnboarding
        - previousSeenAt
