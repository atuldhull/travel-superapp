info:
  title: TravelSuperApp API
  description: OpenAPI export from the running NestJS app. Per-route schemas land
    progressively as @ApiBody / @ApiResponse decorators get added module by
    module — see docs/api/README.md.
  version: v1
  contact: {}
tags:
  - name: identity
    description: Auth, sessions, profile, MFA
  - name: trip
    description: Trip CRUD, itinerary, sharing, overview composite
  - name: media
    description: Media uploads, memory books
  - name: social
    description: Reviews, votes, expenses, balances
  - name: notifications
    description: Inbox + delivery channels
  - name: admin
    description: Operator-only moderation surfaces
  - name: account
    description: GDPR / DPDP / COPPA self-export + delete
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: "Access token issued by POST /auth/login or rotated via POST
        /auth/refresh. Lifetime: 15 minutes (configurable via
        JWT_ACCESS_EXPIRY)."
  schemas:
    RegisterRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: rashmi@example.com
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Min 12 chars, max 128.
          example: correct-horse-battery-staple
        displayName:
          type: string
          minLength: 1
          maxLength: 60
          example: Rashmi Singh
      required:
        - email
        - password
        - displayName
    AuthSuccessResponseDto:
      type: object
      properties:
        userId:
          type: string
          format: cuid
          description: Authenticated user id.
          example: clxn8q3t40000jq08yzn4l1ab
        accessToken:
          type: string
          description: Bearer access token (JWT). Memory-only — never localStorage.
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjFhYjJjM2Q0In0.eyJzdWIiOiJjbHhuOHEzdDQwMDAwIn0.signature…
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 timestamp at which the access token expires.
          example: 2026-05-26T10:35:00.000Z
      required:
        - userId
        - accessToken
        - expiresAt
    OAuthSignInRequestDto:
      type: object
      properties:
        idToken:
          type: string
          description: Provider-issued ID token (e.g. Google id_token, Apple
            identityToken). Real Google tokens are ~1.2KB; max enforced at 8192.
          minLength: 1
          maxLength: 8192
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjFhYjJjM2Q0In0.eyJpc3MiOiJodHRwczovL2FjY291bnRzLmdvb2dsZS5jb20iLCJhdWQiOiI…
      required:
        - idToken
    MagicLinkRequestRequestDto:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: rashmi@example.com
      required:
        - email
    MagicLinkRequestResponseDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          description: Always 'ok'. Doesn't reveal whether the email is registered.
          example: ok
      required:
        - status
    MagicLinkConsumeRequestDto:
      type: object
      properties:
        token:
          type: string
          description: 64 lower-case hex characters (32 random bytes) from the email link
            URL.
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
          example: b27e1a5cc4e8f9d2a1b6c3d8e9f4a7b2c5d8e1f4a7b0c3d6e9f2a5b8c1d4e7f0
      required:
        - token
    LoginCodeRequestRequestDto:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
          example: email
        destination:
          type: string
          maxLength: 254
          description: Email address, or E.164-ish phone (optional leading +, 7..15 digits).
          example: rashmi@example.com
      required:
        - channel
        - destination
    LoginCodeVerifyRequestDto:
      type: object
      properties:
        channel:
          type: string
          enum:
            - email
            - phone
          example: email
        destination:
          type: string
          maxLength: 254
          example: rashmi@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit code.
          example: "482915"
      required:
        - channel
        - destination
